name: WASM

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/libjpeg-turbo-rs-wasm/**'
      - 'Cargo.toml'
      - 'tests/**'
      - '.cargo/config.toml'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/libjpeg-turbo-rs-wasm/**'
      - 'Cargo.toml'
      - 'tests/**'
      - '.cargo/config.toml'
      - '.github/workflows/wasm.yml'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Check main crate compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown

      # P4-143 (#474): `.cargo/config.toml` forces `+simd128` on every in-tree
      # build, so without this leg no job ever compiles the baseline wasm32
      # configuration downstream consumers actually get. Setting RUSTFLAGS
      # overrides the config's target rustflags, removing `+simd128`; denying
      # warnings makes gated-out-but-still-compiled SIMD code (dead-code
      # warnings) a failure, since that is the drift shape this leg exists to
      # catch. Three feature configs: default (simd on, no simd128 -> scalar),
      # simd off entirely, and simd on without std.
      - name: Check baseline wasm32 (no +simd128, scalar fallback)
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --target wasm32-unknown-unknown -p libjpeg-turbo-rs
          cargo check --target wasm32-wasip1 -p libjpeg-turbo-rs
          cargo check --target wasm32-unknown-unknown -p libjpeg-turbo-rs --no-default-features --features std
          cargo check --target wasm32-unknown-unknown -p libjpeg-turbo-rs --no-default-features --features simd

      - name: Check wrapper crate compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown -p libjpeg-turbo-rs-wasm --tests

      - name: Run existing test suite on WASM (wasm32-wasip1 + wasmtime)
        run: cargo test --target wasm32-wasip1

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build wasm-pack (web target)
        run: cd crates/libjpeg-turbo-rs-wasm && wasm-pack build --target web

      - name: Run wasm-bindgen tests
        run: cd crates/libjpeg-turbo-rs-wasm && wasm-pack test --node

      - name: Verify output artifacts
        run: |
          test -f crates/libjpeg-turbo-rs-wasm/pkg/libjpeg_turbo_rs_wasm_bg.wasm
          test -f crates/libjpeg-turbo-rs-wasm/pkg/libjpeg_turbo_rs_wasm.js
          test -f crates/libjpeg-turbo-rs-wasm/pkg/libjpeg_turbo_rs_wasm.d.ts
          echo "WASM size: $(wc -c < crates/libjpeg-turbo-rs-wasm/pkg/libjpeg_turbo_rs_wasm_bg.wasm) bytes"
