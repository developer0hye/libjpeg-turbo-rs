homepage: "https://github.com/developer0hye/libjpeg-turbo-rs"
language: rust
primary_contact: "yhkwon@markany.com"
auto_ccs:
  - "yhkwon@markany.com"
main_repo: "https://github.com/developer0hye/libjpeg-turbo-rs"
