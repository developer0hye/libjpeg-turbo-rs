# OSS-Fuzz supports only AddressSanitizer + libFuzzer for Rust projects
# (google.github.io/oss-fuzz/getting-started/new-project-guide/rust-lang/);
# listing `undefined` and `memory` would be rejected or never run.
sanitizers:
  - address
fuzzing_engines:
  - libfuzzer
