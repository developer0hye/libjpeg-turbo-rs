# cargo-deny policy (issue #390). CI runs:
#   cargo deny check advisories bans licenses sources
# Run locally with the same command (cargo install cargo-deny --locked).

[graph]
all-features = true

[advisories]
# Fail on any advisory: security vulnerabilities, unmaintained crates,
# unsound crates, and yanked versions all deserve a human look.
yanked = "deny"
# No ignore entries. The image bridge deliberately builds `image` with
# default-features = false so the avif→ravif→rav1e chain (whose pinned
# core2/paste carry RUSTSEC advisories) never enters any shipped graph.

[licenses]
# Permissive-only. Everything in the current tree resolves to one of these
# (r-efi is MIT OR Apache-2.0 OR LGPL-2.1-or-later; expression evaluation
# picks the allowed branch).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "NCSA",
]
confidence-threshold = 0.8

[bans]
# Duplicate major versions are common in the dev-dependency tree
# (criterion, image test stack); warn rather than fail, but surface them.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
