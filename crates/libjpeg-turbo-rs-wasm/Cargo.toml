[package]
name = "libjpeg-turbo-rs-wasm"
version = "0.2.2"
edition = "2021"
description = "WASM bindings for libjpeg-turbo-rs — fast, pure-Rust JPEG codec for the browser"
license = "MIT OR Apache-2.0"
repository = "https://github.com/developer0hye/libjpeg-turbo-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libjpeg-turbo-rs = { path = "../..", default-features = false, features = ["simd"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]
