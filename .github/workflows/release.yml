name: Release

on:
  push:
    # `v*`     — bumps the root crate; runs both crates.io and npm jobs.
    # `wasm-v*` — bumps only the WASM crate; the crates.io job is skipped
    #            and of the publish jobs only npm runs. This lets the WASM
    #            bindings ship fresh fixes without forcing a no-op patch
    #            release of the root crate when no Rust code changed.
    # `capi-v*` — bumps only the capi crate (C ABI shim). Of the publish
    #            jobs only publish-capi runs; the root-crate and WASM jobs
    #            are skipped. Useful for shipping ABI-shim fixes
    #            (mozjpeg compat, install staging, symbol-inventory
    #            additions, etc.) without forcing a no-op root release.
    # `native-artifacts` runs on `v*` and `capi-v*` — both ship the capi
    #            crate the bundle contains — and is skipped on `wasm-v*`.
    #            Only `v*` reaches `github-release`, so on a `capi-v*` tag
    #            the bundles remain workflow artifacts rather than release
    #            assets; P4-131 records that as remaining work.
    tags: ['v*', 'wasm-v*', 'capi-v*']
  # P4-131: build the native bundles without publishing anything, so the
  # packaging matrix — including the cross-built legs — can be exercised
  # before a tag makes the result public.
  #
  # Every publish job below additionally requires `github.event_name ==
  # 'push'`. The tag-shape test alone would not be enough: `gh workflow run
  # release.yml --ref v1.2.3` dispatches with `github.ref` still pointing at
  # `refs/tags/v1.2.3`, so a dispatch could otherwise reach crates.io and
  # npm. A dispatch publishes nothing from any ref.
  workflow_dispatch:
  # NOTE: no `release: published` trigger (codex P1). Entering via an
  # already-public Release would put the Release online BEFORE changelog
  # validation and registry uploads — the exact partial-release state
  # the sequencing below prevents. Tag pushes and the artifact-only
  # dispatch are the entry points; the github-release job creates the
  # Release as the final step.

jobs:
  # Gate for root-crate (`v*`) tags: the tag's CHANGELOG.md section must
  # exist BEFORE anything publishes (issue #390; sequencing per codex P1
  # — validation precedes publication, release creation comes last, so
  # a missing changelog entry can never race the registry uploads).
  changelog-check:
    name: Validate CHANGELOG entry for tag
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - name: Require a CHANGELOG section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > /tmp/notes.md
          if ! grep -q "[^[:space:]]" /tmp/notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION — write it, retag or re-run"
            exit 1
          fi
          echo "CHANGELOG section for $VERSION found:"
          cat /tmp/notes.md

  publish:
    name: Publish libjpeg-turbo-rs to crates.io
    runs-on: ubuntu-latest
    needs: [changelog-check, native-artifacts]
    # Skip on WASM-only or capi-only tags — those don't bump the root
    # crate. `!cancelled()` (not `always()`) so operator cancellation
    # stops the run before the irreversible upload (codex P1). For `v*`
    # tags a failed changelog-check blocks every publish.
    #
    # `native-artifacts` is a prerequisite for the same reason changelog-check
    # is: validation precedes publication. A crates.io upload cannot be taken
    # back, so a bundle leg that fails after it would leave the version public
    # with no release to attach binaries to — the partial-release state this
    # sequencing exists to prevent (P4-131).
    if: ${{ !cancelled() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/wasm-v') && !startsWith(github.ref, 'refs/tags/capi-v') && needs.changelog-check.result == 'success' && needs.native-artifacts.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --allow-dirty
      - name: Publish to crates.io (skip if already published)
        # Codex P2: a blanket `|| echo` swallowed real upload failures
        # (bad token, permissions, network) and reported a green release
        # workflow with no actual publish. Only swallow the documented
        # "already uploaded" case; everything else must keep the job
        # failing so the release tag does not look successful.
        run: |
          # GitHub Actions runs Bash steps with `-eo pipefail`, so a
          # naked `output=$(cmd)` exits the step on any non-zero status
          # before our `status=$?` capture can run. Disable errexit
          # only for the publish itself; restore immediately so any
          # subsequent shell error still fails the step.
          set +e
          output=$(cargo publish --allow-dirty 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qiE "already (uploaded|exists)"; then
            echo "::warning::libjpeg-turbo-rs already at this version on crates.io; skipping"
            exit 0
          fi
          echo "::error::cargo publish failed for libjpeg-turbo-rs (not an already-published case)"
          exit "$status"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-capi:
    name: Publish libjpeg-turbo-rs-capi to crates.io
    runs-on: ubuntu-latest
    # Run when:
    #   - `v*` tag → root crate published first via `needs: publish`,
    #     then capi (which depends on the root crate) goes second.
    #   - `capi-v*` tag → root crate is already on crates.io (capi
    #     ships an ABI-shim-only fix); skip the wait and publish capi
    #     directly.
    # changelog-check must not have FAILED: on `v*` tags a missing
    # CHANGELOG section blocks this job too (`skipped` = capi-v* tag,
    # where no root section is expected).
    #
    # The `push` test is what keeps that tolerance from becoming an entry
    # point: this job accepts `publish` as *skipped*, so on a P4-131 artifact
    # dispatch — where every upstream job skips — it would otherwise have
    # published to crates.io. A tag *shape* test would not close it, since a
    # dispatch can name a tag ref.
    #
    # `native-artifacts` runs on both tags this job serves, so `success` is
    # required outright: the bundle must build before the upload nobody can
    # undo (P4-131).
    needs: [publish, changelog-check, native-artifacts]
    if: ${{ !cancelled() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/wasm-v') && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && needs.changelog-check.result != 'failure' && needs.native-artifacts.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # Wait for crates.io to index the root crate before capi's
      # `cargo publish --dry-run` resolves the dependency. The cargo
      # registry usually takes < 30 s but can spike to a minute or two
      # under load; 90 s buffer keeps the wait deterministic without
      # being long enough to balloon CI billing.
      - name: Wait for crates.io to index the root crate
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: sleep 90
      - run: cargo publish -p libjpeg-turbo-rs-capi --dry-run --allow-dirty
      - name: Publish to crates.io (skip if already published)
        # Codex P2: same precise-failure handling as the root publish step
        # — only swallow "already uploaded" responses; surface every other
        # cargo publish failure (token, permissions, network, build error)
        # as a real job failure so the release tag does not appear green.
        run: |
          # Disable errexit only around the publish so the assignment
          # captures cargo's exit status instead of failing the step
          # immediately on a non-zero return (GHA's default `set -e`).
          set +e
          output=$(cargo publish -p libjpeg-turbo-rs-capi --allow-dirty 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qiE "already (uploaded|exists)"; then
            echo "::warning::libjpeg-turbo-rs-capi already at this version on crates.io; skipping"
            exit 0
          fi
          echo "::error::cargo publish failed for libjpeg-turbo-rs-capi (not an already-published case)"
          exit "$status"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Issue #380: the image bridge is the highest-leverage adoption
  # artifact — it must ship with every root release or the crates.io
  # page goes stale against the root crate it re-exports.
  publish-image:
    name: Publish libjpeg-turbo-rs-image to crates.io
    runs-on: ubuntu-latest
    # After capi for registry-index ordering only (both depend solely on
    # the root crate). Runs on `v*` tags; capi-v*/wasm-v* don't bump the
    # bridge.
    needs: [publish-capi, changelog-check]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/wasm-v') && !startsWith(github.ref, 'refs/tags/capi-v') && (needs.publish-capi.result == 'success') && needs.changelog-check.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for crates.io to index the root crate
        run: sleep 90
      - run: cargo publish -p libjpeg-turbo-rs-image --dry-run --allow-dirty
      - name: Publish to crates.io (skip if already published)
        # Same precise-failure handling as the other publish steps.
        run: |
          set +e
          output=$(cargo publish -p libjpeg-turbo-rs-image --allow-dirty 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qiE "already (uploaded|exists)"; then
            echo "::warning::libjpeg-turbo-rs-image already at this version on crates.io; skipping"
            exit 0
          fi
          echo "::error::cargo publish failed for libjpeg-turbo-rs-image (not an already-published case)"
          exit "$status"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-wasm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [publish, changelog-check, native-artifacts]
    # Run on `v*` (root crate published) and `wasm-v*` (publish job
    # was skipped intentionally). Skip on `capi-v*` — those are ABI
    # shim releases that don't bump the WASM bindings. Like
    # publish-capi, a FAILED changelog-check blocks this job, and
    # `!cancelled()` honors operator cancellation. `push` for the same
    # reason as publish-capi: accepting a *skipped* `publish` is what lets
    # a `wasm-v*` tag through, and without the event test it would also let
    # the P4-131 artifact dispatch publish to npm.
    #
    # `native-artifacts` may be *skipped* here and only here: it does not run
    # on `wasm-v*`, which ships no native library. On a `v*` tag it runs, so
    # `skipped` cannot mask a bundle failure.
    if: ${{ !cancelled() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/capi-v') && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && needs.changelog-check.result != 'failure' && (needs.native-artifacts.result == 'success' || needs.native-artifacts.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: curl https://wasmtime.dev/install.sh -sSf | bash && echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Run WASM test suite (wasm32-wasip1)
        run: cargo test --target wasm32-wasip1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run wasm-bindgen tests
        run: cd crates/libjpeg-turbo-rs-wasm && wasm-pack test --node

      - name: Build wasm-pack (bundler target)
        run: cd crates/libjpeg-turbo-rs-wasm && wasm-pack build --target bundler --out-dir pkg

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (skip if already published)
        # Same precise-failure handling as the cargo publish steps:
        # only swallow npm's "you cannot publish over the previously
        # published versions" response (EPUBLISHCONFLICT). Token /
        # network / build failures must keep the job red so the
        # release tag does not look successful when nothing actually
        # uploaded.
        run: |
          cd crates/libjpeg-turbo-rs-wasm/pkg
          # Disable errexit around the publish so we can inspect npm's
          # exit code instead of failing the step immediately on the
          # documented duplicate-version response.
          set +e
          output=$(npm publish --access public 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qiE "EPUBLISHCONFLICT|cannot publish over|already published"; then
            echo "::warning::libjpeg-turbo-rs-wasm already at this version on npm; skipping"
            exit 0
          fi
          echo "::error::npm publish failed for libjpeg-turbo-rs-wasm (not an already-published case)"
          exit "$status"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # P4-131: the native binary artifact. Every job above ships source to a
  # registry; none produced a library a packager could install, so replacing
  # a system `libjpeg.so.8` meant cloning this repository, installing a Rust
  # toolchain and running `scripts/install_capi.sh` by hand.
  #
  # `package_capi_release.sh` stages nothing of its own — it calls that same
  # install script and archives what it produced, which is P4-131's third
  # criterion and P4-124's precondition: one staging path, so the bundle a
  # packager downloads can be the tree the downstream harnesses test. (They
  # do not test it yet — P4-124 is open and still stages the raw cargo
  # cdylib. This makes that closable.)
  # `crates/libjpeg-turbo-rs-capi/tests/release_bundle.rs` holds the
  # invariant by comparing an unpacked bundle against a direct install run,
  # and runs on every pull request via ci.yml's `capi-abi-checks`.
  #
  # Runs FIRST, ahead of every publish job, because a crates.io or npm upload
  # cannot be withdrawn: a bundle that fails to build must fail before the
  # irreversible step, not after it. Not a publish job itself, so it is also
  # the one job a dispatch may run. Skipped on `wasm-v*`, which ships no
  # native library. Windows (DLL + import library) is still open; P4-131
  # stays PARTIAL until it lands.
  native-artifacts:
    name: Native bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: ${{ !cancelled() && ((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/wasm-v')) || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-built on the arm64 runner: the macOS SDK is universal, and
          # the bundle's shape is what this leg verifies. Nothing here
          # executes the x86_64 library — the parity suites that do run in
          # ci.yml on their own hosts.
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      # `submodules: recursive` is load-bearing, not boilerplate: the staged
      # headers are copied verbatim out of references/libjpeg-turbo.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # install_capi.sh degrades to a warning when patchelf is absent, and
      # then the staged library keeps the build-time cdylib SONAME. A
      # downstream linked with `-ljpeg` would record that name in DT_NEEDED
      # and ldd would resolve it to a different file. Install it rather than
      # ship the warning.
      - name: Install patchelf (Linux SONAME patching)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Package the installed prefix
        run: |
          set -o pipefail
          bash scripts/package_capi_release.sh \
            --outdir dist --target ${{ matrix.target }} --build 2>&1 | tee package.log
      # The GNU symbol-version nodes come from a relink that also degrades to
      # a warning when its prerequisites are missing (P4-81). A published
      # bundle is exactly where that silent downgrade must not happen:
      # prebuilt consumers would report "no version information available"
      # against a library we shipped as a drop-in.
      - name: Require the symbol-version relink (P4-81)
        if: runner.os == 'Linux'
        run: |
          if ! grep -q 'P4-81: relinked' package.log; then
            echo "::error::the staged library was not relinked with GNU symbol versions"
            cat package.log
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # Runs LAST (issue #390, sequenced per codex P1): the GitHub Release
  # only appears after every publish channel for a `v*` tag succeeded,
  # so a failed registry upload can never leave a public release for a
  # version that is not actually installable. Notes come from the
  # CHANGELOG section that changelog-check already validated.
  #
  # `native-artifacts` joins that set for the same reason (P4-131): a
  # release whose binaries failed to build is a release whose download
  # links are missing, which is worse than no release at all.
  github-release:
    name: Create GitHub Release from CHANGELOG
    runs-on: ubuntu-latest
    needs: [changelog-check, publish, publish-capi, publish-image, publish-wasm, native-artifacts]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.changelog-check.result == 'success' && needs.publish.result == 'success' && needs.publish-capi.result == 'success' && needs.publish-image.result == 'success' && needs.publish-wasm.result == 'success' && needs.native-artifacts.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      # One manifest for the whole release (P4-131 criterion 2), attached
      # *alongside* the per-bundle `.sha256` files rather than replacing them:
      # `SHA256SUMS` verifies a complete download set in one command, and the
      # per-bundle file is what someone who took a single tarball can use —
      # which is also what that bundle's own BUNDLE.txt tells them to run.
      #
      # `set -euo pipefail` and `failglob` because GitHub's default shell is
      # `bash -e` with no pipefail: an unmatched glob would otherwise pass the
      # literal to `cat`, and `sort`'s exit 0 would mask the failure into an
      # empty manifest.
      - name: Fold the per-bundle checksums into one manifest
        run: |
          set -euo pipefail
          shopt -s failglob
          cd dist
          cat ./*.tar.gz.sha256 | sort -k 2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Create release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A pre-existing release keeps its notes — but it must still get
          # the binaries, or the P4-131 download links silently go missing
          # for exactly the releases someone drafted by hand.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release for $TAG already exists (drafted manually?); leaving its notes alone and uploading the native bundles"
            gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS
            exit 0
          fi
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > /tmp/notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/notes.md \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS
