name: Fuzz Smoke

# Scheduled libFuzzer smoke test, uploading any new crashes as artifacts.
# Intentionally kept as its own workflow so it does not gate PR merges on
# libFuzzer flakes or missing nightly toolchain components.
#
# Throughput hardening (2026-07-08) — find bugs faster:
#   - runs every 6 hours instead of nightly (4x feedback cadence);
#   - `-fork=4` uses all runner vCPUs — the differential targets spend most
#     wall time blocked on djpeg/cjpeg/jpegtran subprocesses, so parallel
#     workers overlap that wait;
#   - `-dict=fuzz/jpeg.dict` feeds marker-structure mutations (the dict was
#     committed with the corpus expansion but never wired into this run);
#   - `-timeout=30` turns per-input hangs into findings instead of letting
#     one input silently eat the whole budget (libFuzzer default is 1200s);
#   - the corpus accumulates across runs via actions/cache (saved even when
#     the run fails), so every run explores new frontier instead of
#     re-discovering the same coverage from the deterministic seeds, and is
#     `cmin`-minimized on green runs to keep the cache lean.

on:
  schedule:
    # xx:17 UTC every 6 hours — offset from the top of the hour to avoid
    # the GitHub scheduler's congestion window.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds per target (default 600, clamped to 1800 to fit the job timeout)"
        required: false
        default: "600"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Sized for the 1800s clamp on MAX_TOTAL_TIME (30 min fuzz + toolchain
    # setup + build + cmin margin). GitHub expressions cannot do arithmetic,
    # so the budget is clamped in the run step instead of derived here.
    timeout-minutes: 75
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '600' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_decompress
          - fuzz_decompress_lenient
          - fuzz_decompress_precision  # 12/16-bit + arbitrary-precision decode (issue #382)
          - fuzz_roundtrip
          - fuzz_read_coefficients
          - fuzz_transform
          - fuzz_progressive_decoder
          - fuzz_encode_roundtrip
          - fuzz_transform_options
          - fuzz_decode_diff_c     # P2-7 differential decode vs subprocess djpeg
          - fuzz_encode_diff_c     # P2-7 differential encode-roundtrip vs subprocess djpeg
          - fuzz_transform_diff_c  # P2-7 differential transform vs subprocess jpegtran
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        # Use the prebuilt cargo-fuzz binary from GitHub Releases via
        # taiki-e/install-action. `cargo install cargo-fuzz` (locked OR
        # unlocked) is broken under current nightly rustc as of 2026-05:
        # the resolver picks rustix 0.36.5 which uses the
        # `rustc_layout_scalar_valid_range_end` attribute that current
        # nightly rustc no longer accepts → "cannot find attribute".
        # Reproduced in runs 25301178952 (2026-05-04) and 25416520113
        # (2026-05-06) under both `--locked` and unlocked installs.
        # The prebuilt binary sidesteps the dep-resolution problem and
        # is also ~5× faster than building from source.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Install libjpeg-turbo 3.x tools for differential targets
        if: matrix.target == 'fuzz_decode_diff_c' || matrix.target == 'fuzz_encode_diff_c' || matrix.target == 'fuzz_transform_diff_c'
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.1.4.1
          curl -fL -o /tmp/ljt.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get install -y /tmp/ljt.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
          # Asserted, not printed. These three targets *are* a differential
          # comparison against these binaries, so a crash they report and a
          # crash they miss both mean something different if the install is a
          # release nobody checked (P4-130).
          /opt/libjpeg-turbo/bin/djpeg -version 2>&1 | tee /tmp/oracle-version.txt
          grep -q "version 3.1.4.1" /tmp/oracle-version.txt
          /opt/libjpeg-turbo/bin/cjpeg -version 2>&1 | grep -q "version 3.1.4.1"
          /opt/libjpeg-turbo/bin/jpegtran -version 2>&1 | grep -q "version 3.1.4.1"

      - name: Restore accumulated corpus
        # Coverage-driven corpus carried over from previous runs. The key
        # never hits exactly (it embeds the run id AND the attempt, so even
        # a rerun of the same run saves fresh progress); restore-keys picks
        # the most recent save and the post-run save step always writes a
        # new entry — the standard pattern for an evolving cache.
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ matrix.target }}-

      - name: Regenerate seed corpus
        run: cargo test --test generate_fuzz_seeds

      - name: Run fuzzer
        # `--target x86_64-unknown-linux-gnu` is mandatory: the prebuilt
        # cargo-fuzz binary we install above is musl-linked, so without
        # an explicit target it defaults to its host triple
        # (x86_64-unknown-linux-musl) and the build fails with
        # "sanitizer is incompatible with statically linked libc" plus
        # "can't find crate for `core`" because the rust-musl target
        # isn't installed on ubuntu-latest. Explicitly building for gnu
        # picks up the host toolchain that dtolnay/rust-toolchain set up.
        run: |
          # Clamp the dispatch input so the fuzz budget always fits inside
          # timeout-minutes — a cancelled job would skip the repro/artifact
          # upload steps.
          EFFECTIVE_TIME="${MAX_TOTAL_TIME}"
          if [ "${EFFECTIVE_TIME}" -gt 1800 ]; then
            echo "max_total_time=${EFFECTIVE_TIME} clamped to 1800"
            EFFECTIVE_TIME=1800
          fi
          # Expose the clamped budget to the failure-path repro step so the
          # uploaded rerun command matches what CI actually executed.
          echo "EFFECTIVE_TIME=${EFFECTIVE_TIME}" >> "$GITHUB_ENV"
          cargo +nightly fuzz run \
            --target x86_64-unknown-linux-gnu \
            "${FUZZ_TARGET}" \
            -- -max_total_time="${EFFECTIVE_TIME}" \
               -fork=4 \
               -timeout=30 \
               -dict=fuzz/jpeg.dict \
               -print_final_stats=1

      - name: Minimize corpus before caching
        # Keep the accumulated cache lean: drop corpus entries whose
        # coverage is subsumed by others. Only on green runs — after a
        # crash we want the full discovery neighborhood preserved.
        # Non-fatal: a cmin hiccup must not fail an otherwise green run.
        if: success()
        run: |
          cargo +nightly fuzz cmin \
            --target x86_64-unknown-linux-gnu \
            "${FUZZ_TARGET}" || true

      - name: Save accumulated corpus
        # Save even on failure so the coverage that led to a crash is not
        # lost with the failed job.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Write repro metadata
        if: failure()
        run: |
          mkdir -p "fuzz/repro/${FUZZ_TARGET}"

          {
            echo "Fuzz Smoke repro"
            echo
            echo "target: ${FUZZ_TARGET}"
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
            echo "commit: ${GITHUB_SHA}"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "max_total_time: ${EFFECTIVE_TIME:-${MAX_TOTAL_TIME}} (requested ${MAX_TOTAL_TIME})"
            echo
            echo "Rebuild the seed corpus first:"
            echo "  cargo test --test generate_fuzz_seeds"
            echo
            echo "Re-run the same smoke budget:"
            echo "  cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${FUZZ_TARGET} -- -max_total_time=${EFFECTIVE_TIME:-${MAX_TOTAL_TIME}} -fork=4 -timeout=30 -dict=fuzz/jpeg.dict -print_final_stats=1"
            echo
            echo "Download crash artifacts from this run:"
            echo "  gh run download ${GITHUB_RUN_ID} -n fuzz-artifacts-${FUZZ_TARGET} -D fuzz/artifacts/${FUZZ_TARGET}"
            echo
            echo "Reproduce a downloaded crash artifact:"
            echo "  cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${FUZZ_TARGET} fuzz/artifacts/${FUZZ_TARGET}/<crash-file> -- -runs=1"
            echo
            echo "Differential target note:"
            case "${FUZZ_TARGET}" in
              fuzz_decode_diff_c|fuzz_encode_diff_c|fuzz_transform_diff_c)
                echo "  Install libjpeg-turbo 3.1.4.1 C tools and put /opt/libjpeg-turbo/bin first on PATH."
                echo "  ARCH=\$(dpkg --print-architecture)"
                echo "  VERSION=3.1.4.1"
                echo "  curl -fL -o /tmp/ljt.deb \"https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/\${VERSION}/libjpeg-turbo-official_\${VERSION}_\${ARCH}.deb\""
                echo "  sudo apt-get install -y /tmp/ljt.deb"
                echo "  export PATH=/opt/libjpeg-turbo/bin:\${PATH}"
                ;;
              *)
                echo "  No C tool dependency for this target."
                ;;
            esac
          } > "fuzz/repro/${FUZZ_TARGET}/repro.txt"

          {
            echo "rustc"
            rustc -Vv || true
            echo
            echo "cargo"
            cargo -V || true
            echo
            echo "cargo-fuzz"
            cargo fuzz --version || true
            echo
            echo "C tools"
            for tool in djpeg cjpeg jpegtran; do
              echo "${tool}"
              if command -v "${tool}" >/dev/null 2>&1; then
                command -v "${tool}"
                "${tool}" -version || true
              else
                echo "not found"
              fi
              echo
            done
          } > "fuzz/repro/${FUZZ_TARGET}/versions.txt" 2>&1

      - name: Upload repro metadata
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-repro-${{ matrix.target }}
          path: fuzz/repro/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
