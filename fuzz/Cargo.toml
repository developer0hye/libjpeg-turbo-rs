[package]
name = "libjpeg-turbo-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# libc is used by the *_diff_c targets to mask SIGPIPE before writing
# to subprocess stdin. With `#![no_main]` libfuzzer skips std's default
# SIGPIPE → SIG_IGN setup, so a pipe-write to a closed peer would kill
# the fuzz process with signal 13 instead of returning Err(BrokenPipe).
libc = "0.2"

[dependencies.libjpeg-turbo-rs]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_decompress"
path = "fuzz_targets/fuzz_decompress.rs"
doc = false

[[bin]]
name = "fuzz_decompress_precision"
path = "fuzz_targets/fuzz_decompress_precision.rs"
doc = false

[[bin]]
name = "fuzz_decompress_lenient"
path = "fuzz_targets/fuzz_decompress_lenient.rs"
doc = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_read_coefficients"
path = "fuzz_targets/fuzz_read_coefficients.rs"
doc = false

[[bin]]
name = "fuzz_transform"
path = "fuzz_targets/fuzz_transform.rs"
doc = false

[[bin]]
name = "fuzz_progressive_decoder"
path = "fuzz_targets/fuzz_progressive_decoder.rs"
doc = false

[[bin]]
name = "fuzz_encode_roundtrip"
path = "fuzz_targets/fuzz_encode_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_transform_options"
path = "fuzz_targets/fuzz_transform_options.rs"
doc = false

# P2-7: differential decode fuzzer. Compares Rust decode output to
# subprocessed `djpeg` for each fuzzed input and panics on divergence.
[[bin]]
name = "fuzz_decode_diff_c"
path = "fuzz_targets/fuzz_decode_diff_c.rs"
doc = false

# P2-7 follow-up: differential encode-roundtrip-vs-C fuzzer. Encodes
# fuzzed pixels via Rust then compares Rust-decode and C-djpeg-decode
# of the encoded JPEG, panicking on divergence.
[[bin]]
name = "fuzz_encode_diff_c"
path = "fuzz_targets/fuzz_encode_diff_c.rs"
doc = false

# P2-7 follow-up: differential transform-vs-jpegtran fuzzer. Applies
# the same lossless transform via Rust and via subprocessed jpegtran,
# decodes both via djpeg, asserts pixel agreement.
[[bin]]
name = "fuzz_transform_diff_c"
path = "fuzz_targets/fuzz_transform_diff_c.rs"
doc = false
