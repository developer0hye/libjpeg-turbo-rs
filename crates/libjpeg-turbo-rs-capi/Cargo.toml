[package]
name = "libjpeg-turbo-rs-capi"
version = "0.1.2"
edition = "2021"
rust-version = "1.87"
description = "C ABI shim for libjpeg-turbo-rs: TurboJPEG 3 on libturbojpeg.so.0 (primary target) plus an experimental libjpeg.so.8 leg for v8 consumers; v6b/v7 are non-goals (21 of 39 TJ 1.x/2.x legacy aliases wired; remaining 18 documented with migration matrix per P4-18)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/developer0hye/libjpeg-turbo-rs"
# `publish = true` (default) — released to crates.io via
# .github/workflows/release.yml on `v*` tags. The capi crate ships
# alongside the root crate and tracks the same version stream.
build = "build.rs"

[lib]
name = "libjpeg_turbo_rs_capi"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Pass-through: enables PNG support in the underlying libjpeg-turbo-rs crate,
# which makes tj3LoadImage8 / tj3SaveImage8 dispatch to the png codec for
# .png files. Off by default — callers opt in with --features png.
png = ["libjpeg-turbo-rs/png"]

[dependencies]
# `path` is used for local workspace builds; `version` is what crates.io
# resolves to when this crate is depended on as a published artifact.
# Both must be present — path-only deps are rejected by `cargo publish`.
libjpeg-turbo-rs = { path = "../..", version = "0.8" }

[dev-dependencies]
libloading = "0.9"
tempfile = "3"
