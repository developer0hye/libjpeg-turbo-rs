[workspace]
members = [".", "crates/libjpeg-turbo-rs-wasm", "crates/libjpeg-turbo-rs-image", "crates/libjpeg-turbo-rs-capi"]

[package]
name = "libjpeg-turbo-rs"
version = "0.8.0"
edition = "2021"
rust-version = "1.87"
description = "Pure-Rust libjpeg-turbo: NEON/AVX2/SSE2/WASM-SIMD128 JPEG decode + encode, no_std-capable, C-cross-validated"
license = "MIT OR Apache-2.0"
repository = "https://github.com/developer0hye/libjpeg-turbo-rs"
readme = "README.md"
keywords = ["jpeg", "image", "simd", "encoder", "decoder"]
categories = ["multimedia::images", "multimedia::encoding"]
exclude = [
    "references/",
    "tests/fixtures/",
    "examples/",
    "benches/",
    "docs/",
    "experiments/",
    "bench_c_*",
    "*.md",
    "!README.md",
    ".github/",
    "ralph/",
]

[features]
default = ["std", "simd"]
# `std` (default): std::io streaming API, file-path helpers, runtime SIMD
# feature detection, and std-backed error types. Disable for a
# `no_std + alloc` core codec (issue #356).
std = ["thiserror/std"]
simd = []
# INTERNAL, test-only (issue #386): widens the C cross-validation test
# matrices in tests/c_tjcomptest.rs, c_tjdecomptest.rs, c_tjtrantest.rs
# and c_croptest.rs (all four run by .github/workflows/full-c-parity.yml).
# Gates no library code — enabling it changes nothing for consumers of
# the crate.
full-c-parity = []
# Optional PNG support for tj3LoadImage8 / tj3SaveImage8. Off by default so
# the codec crate stays small. Enable with --features png.
png = ["dep:png", "std"]

# docs.rs: build with the png feature visible and let doc_cfg badge the
# feature-gated items (issue #387).
[package.metadata.docs.rs]
features = ["png"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = { version = "2", default-features = false }
png = { version = "0.18", optional = true }

[dev-dependencies]
zune-jpeg = "0.5"
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

# Loom permutation testing for concurrency stress (gated behind `--cfg loom`).
# Activate: `RUSTFLAGS="--cfg loom" cargo test --release`.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "encode"
harness = false

[profile.release]
lto = true
