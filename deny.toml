# cargo-deny policy (issue #390). CI runs:
#   cargo deny check advisories bans licenses sources
# Run locally with the same command (cargo install cargo-deny --locked).

[graph]
all-features = true

[advisories]
# Fail on any advisory: security vulnerabilities, unmaintained crates,
# unsound crates, and yanked versions all deserve a human look.
yanked = "deny"
# Documented exceptions only. All three below come through the same
# chain — image → ravif → rav1e (the image crate's AVIF encoder) —
# which exists solely in the image-bridge crate's graph; none of it is
# code this workspace ships. Nothing to update: rav1e 0.8 pins these,
# and core2 has no unyanked version at all. Revisit on image/rav1e bumps.
ignore = [
  { id = "RUSTSEC-2026-0105", reason = "core2 unmaintained; via image→ravif→rav1e→bitstream-io" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; compile-time proc-macro via rav1e" },
  { crate = "core2@0.4.0", reason = "all versions yanked upstream; same rav1e chain, no replacement to update to" },
]

[licenses]
# Permissive-only. Everything in the current tree resolves to one of these
# (r-efi is MIT OR Apache-2.0 OR LGPL-2.1-or-later; expression evaluation
# picks the allowed branch).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "NCSA",
]
confidence-threshold = 0.8

[bans]
# Duplicate major versions are common in the dev-dependency tree
# (criterion, image test stack); warn rather than fail, but surface them.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
