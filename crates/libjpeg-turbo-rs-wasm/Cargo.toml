[package]
name = "libjpeg-turbo-rs-wasm"
version = "0.2.2"
# Distribution (issue #380): npm is the channel — release.yml publishes
# the wasm-pack bundle on v*/wasm-v* tags. crates.io publication is not
# planned: the crate is wasm-bindgen glue, useless as a cargo dependency;
# Rust consumers depend on the root crate and build for wasm32 directly.
edition = "2021"
description = "WASM bindings for libjpeg-turbo-rs — fast, pure-Rust JPEG codec for the browser"
license = "MIT OR Apache-2.0"
repository = "https://github.com/developer0hye/libjpeg-turbo-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `version` alongside `path` so the crate is publishable (issue #380).
# default-features stays off here deliberately: wasm32 SIMD128 dispatch
# is compile-time (`target_feature`), so the `std` runtime-CPU-detection
# rationale that applies to the image bridge (issue #381) does not apply
# on this target.
libjpeg-turbo-rs = { path = "../..", version = "0.8.0", default-features = false, features = ["simd"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]
