name: WASM

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/libjpeg-turbo-wasm/**'
      - 'Cargo.toml'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/libjpeg-turbo-wasm/**'
      - 'Cargo.toml'
      - '.github/workflows/wasm.yml'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check main crate compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown

      - name: Check wrapper crate compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown -p libjpeg-turbo-wasm --tests

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm-pack (web target)
        run: cd crates/libjpeg-turbo-wasm && wasm-pack build --target web

      - name: Verify output artifacts
        run: |
          test -f crates/libjpeg-turbo-wasm/pkg/libjpeg_turbo_wasm_bg.wasm
          test -f crates/libjpeg-turbo-wasm/pkg/libjpeg_turbo_wasm.js
          test -f crates/libjpeg-turbo-wasm/pkg/libjpeg_turbo_wasm.d.ts
          echo "WASM size: $(wc -c < crates/libjpeg-turbo-wasm/pkg/libjpeg_turbo_wasm_bg.wasm) bytes"
