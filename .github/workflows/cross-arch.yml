name: Cross-Arch SIMD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Every oracle leg here is paired: one job at `tool-baseline` (3.1.4.1) and one
# `-current-oracle` twin at `tool-current` (3.2.0), per
# `docs/oracle_versions.tsv`. A single global bump is what P4-130's first
# acceptance criterion forbids — it re-baselines every expectation at once, and
# a divergence it papers over is indistinguishable from a pass.
#
# Paired *per backend* rather than once, because that is what this workflow
# measures. `ci.yml`'s pair runs the root matrix on one x86_64 runner with
# whatever the default codegen picks; the answers here come from NEON, from
# AVX2-enabled codegen and from codegen with AVX2 and SSE4.2 switched off, and
# every one of them is our SIMD bytes compared against C's. Three backends
# against one release is three unmeasured 3.2.0 answers, not one.
#
# `tests/oracle_version_pins.rs` holds the shape: a job here that installs a C
# libjpeg-turbo without a twin fails the build, and a twin must run the same
# `cargo test` command on the same runner under the same job-level
# environment — RUSTFLAGS included, since a pair that disagrees on it compares
# two backends and blames the difference on an upstream release.
jobs:
  # Linux aarch64 native runner — exercises the NEON backend without
  # emulation. macOS arm64 is already covered by the default CI matrix,
  # so this job closes the remaining Linux-aarch64 gap.
  test-linux-aarch64-neon:
    name: Test (linux-aarch64 NEON)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.1.4.1 from official release (matches the macOS legs' pinned build)
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.1.4.1
          curl -fL -o /tmp/ljt.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/ljt.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
          # Asserted, not printed: the release these SIMD backends are compared
          # against decides what "parity" means here, and a `-version` line
          # nobody reads fails nothing (P4-130).
          /opt/libjpeg-turbo/bin/djpeg -version 2>&1 | tee /tmp/oracle-version.txt
          grep -q "version 3.1.4.1" /tmp/oracle-version.txt
          /opt/libjpeg-turbo/bin/cjpeg -version 2>&1 | grep -q "version 3.1.4.1"
          /opt/libjpeg-turbo/bin/jpegtran -version 2>&1 | grep -q "version 3.1.4.1"
      - name: Run full test suite with NEON SIMD
        # Use default features only — `--all-features` enables `full-c-parity`
        # which gates aspirational Rust-vs-C byte-exact encoder tests (opt-in).
        run: cargo test --tests
        timeout-minutes: 45

  # The NEON backend against current upstream stable. Identical to the leg
  # above in every respect but the release it compares against — same runner,
  # same command, no RUSTFLAGS on either — which is what makes a divergence
  # between the two evidence about 3.2.0 rather than about this job.
  test-linux-aarch64-neon-current-oracle:
    name: Test (linux-aarch64 NEON, oracle 3.2.0)
    runs-on: ubuntu-24.04-arm
    env:
      # Exclusive selection, as on ci.yml's current-parity leg: a tool missing
      # under this prefix is an error rather than a quiet fallback to some
      # other djpeg reporting a 3.2.0 result it did not measure.
      LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.2.0 from official release (current-parity leg)
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.2.0
          curl -fL -o /tmp/ljt320.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/ljt320.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
      # The version this leg is named for has to be the version it runs, and
      # the development files are checked too: some suites compile a C oracle
      # instead of shelling out, and the prefix is exclusive for those as well.
      - name: Verify the oracle really is 3.2.0
        run: |
          /opt/libjpeg-turbo/bin/djpeg -version 2>&1 | tee /tmp/oracle-version.txt
          grep -q "version 3.2.0" /tmp/oracle-version.txt
          /opt/libjpeg-turbo/bin/cjpeg -version 2>&1 | grep -q "version 3.2.0"
          /opt/libjpeg-turbo/bin/jpegtran -version 2>&1 | grep -q "version 3.2.0"
          test -f /opt/libjpeg-turbo/include/jpeglib.h
          test -f /opt/libjpeg-turbo/include/turbojpeg.h
          ls /opt/libjpeg-turbo/lib64/libjpeg.* /opt/libjpeg-turbo/lib/libjpeg.* \
             2>/dev/null | grep -q .
          ls /opt/libjpeg-turbo/lib64/libturbojpeg.* /opt/libjpeg-turbo/lib/libturbojpeg.* \
             2>/dev/null | grep -q .
      - name: Run full test suite with NEON SIMD
        run: cargo test --tests
        timeout-minutes: 45


  # Default x86_64 Linux job with AVX2 explicitly enabled so the AVX2
  # kernels are compiled and exercised. GitHub-hosted ubuntu-24.04
  # runners expose AVX2 in their CPU features.
  test-linux-x86_64-avx2:
    name: Test (linux-x86_64 AVX2)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-C target-feature=+avx2"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.1.4.1 from official release (matches the macOS legs' pinned build)
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.1.4.1
          curl -fL -o /tmp/ljt.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/ljt.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
          # Asserted, not printed: the release these SIMD backends are compared
          # against decides what "parity" means here, and a `-version` line
          # nobody reads fails nothing (P4-130).
          /opt/libjpeg-turbo/bin/djpeg -version 2>&1 | tee /tmp/oracle-version.txt
          grep -q "version 3.1.4.1" /tmp/oracle-version.txt
          /opt/libjpeg-turbo/bin/cjpeg -version 2>&1 | grep -q "version 3.1.4.1"
          /opt/libjpeg-turbo/bin/jpegtran -version 2>&1 | grep -q "version 3.1.4.1"
      - name: Run full test suite with AVX2 enabled
        # Use default features only — `--all-features` enables `full-c-parity`
        # which gates aspirational Rust-vs-C byte-exact encoder tests (opt-in).
        run: cargo test --tests
        timeout-minutes: 45

  # AVX2-enabled codegen against current upstream stable. The RUSTFLAGS below
  # are the leg above's, verbatim: a twin that dropped them would compile a
  # different backend, and the pair would report a codegen difference as an
  # oracle difference.
  test-linux-x86_64-avx2-current-oracle:
    name: Test (linux-x86_64 AVX2, oracle 3.2.0)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-C target-feature=+avx2"
      LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.2.0 from official release (current-parity leg)
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.2.0
          curl -fL -o /tmp/ljt320.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/ljt320.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
      - name: Verify the oracle really is 3.2.0
        run: |
          /opt/libjpeg-turbo/bin/djpeg -version 2>&1 | tee /tmp/oracle-version.txt
          grep -q "version 3.2.0" /tmp/oracle-version.txt
          /opt/libjpeg-turbo/bin/cjpeg -version 2>&1 | grep -q "version 3.2.0"
          /opt/libjpeg-turbo/bin/jpegtran -version 2>&1 | grep -q "version 3.2.0"
          test -f /opt/libjpeg-turbo/include/jpeglib.h
          test -f /opt/libjpeg-turbo/include/turbojpeg.h
          ls /opt/libjpeg-turbo/lib64/libjpeg.* /opt/libjpeg-turbo/lib/libjpeg.* \
             2>/dev/null | grep -q .
          ls /opt/libjpeg-turbo/lib64/libturbojpeg.* /opt/libjpeg-turbo/lib/libturbojpeg.* \
             2>/dev/null | grep -q .
      - name: Run full test suite with AVX2 enabled
        run: cargo test --tests
        timeout-minutes: 45

  # Builds with AVX2 and SSE4.2 disabled at compile time.
  #
  # This is a BUILD check only. It does NOT exercise the AVX2-unavailable
  # path: `-C target-feature` is compile-time, while every SIMD dispatch in
  # this crate is a runtime `is_x86_feature_detected!` CPUID query, which
  # ignores it. On a runner that has AVX2 the tests below still take the AVX2
  # branch. The job that actually tests the fallback is
  # `test-linux-x86_64-no-avx2-emulated`, which masks the feature at the CPUID
  # level and asserts that it did (#320).
  test-linux-x86_64-no-avx2-build:
    name: Build (linux-x86_64, AVX2 disabled at compile time)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-C target-feature=-avx2,-sse4.2"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.1.4.1 from official release (matches the macOS legs' pinned build)
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.1.4.1
          curl -fL -o /tmp/ljt.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/ljt.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
          # Asserted, not printed: the release these SIMD backends are compared
          # against decides what "parity" means here, and a `-version` line
          # nobody reads fails nothing (P4-130).
          /opt/libjpeg-turbo/bin/djpeg -version 2>&1 | tee /tmp/oracle-version.txt
          grep -q "version 3.1.4.1" /tmp/oracle-version.txt
          /opt/libjpeg-turbo/bin/cjpeg -version 2>&1 | grep -q "version 3.1.4.1"
          /opt/libjpeg-turbo/bin/jpegtran -version 2>&1 | grep -q "version 3.1.4.1"
      - name: Run full test suite with AVX2 disabled at compile time
        # Use default features only — `--all-features` enables `full-c-parity`
        # which gates aspirational Rust-vs-C byte-exact encoder tests (opt-in).
        run: cargo test --tests
        timeout-minutes: 45

  # The same compile-time-disabled codegen against current upstream stable.
  #
  # Worth a leg for the reason the job above is worth one, and no more: the
  # SIMD *dispatch* is a runtime CPUID query that ignores these flags, so the
  # kernels this pair exercises are the AVX2 ones either way. What
  # `-C target-feature=-avx2,-sse4.2` does change is how LLVM compiles
  # everything that is not a hand-written kernel — the scalar and portable
  # paths whose bytes these differential suites compare against C's.
  test-linux-x86_64-no-avx2-build-current-oracle:
    name: Build (linux-x86_64, AVX2 disabled at compile time, oracle 3.2.0)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-C target-feature=-avx2,-sse4.2"
      LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.2.0 from official release (current-parity leg)
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.2.0
          curl -fL -o /tmp/ljt320.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/ljt320.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
      - name: Verify the oracle really is 3.2.0
        run: |
          /opt/libjpeg-turbo/bin/djpeg -version 2>&1 | tee /tmp/oracle-version.txt
          grep -q "version 3.2.0" /tmp/oracle-version.txt
          /opt/libjpeg-turbo/bin/cjpeg -version 2>&1 | grep -q "version 3.2.0"
          /opt/libjpeg-turbo/bin/jpegtran -version 2>&1 | grep -q "version 3.2.0"
          test -f /opt/libjpeg-turbo/include/jpeglib.h
          test -f /opt/libjpeg-turbo/include/turbojpeg.h
          ls /opt/libjpeg-turbo/lib64/libjpeg.* /opt/libjpeg-turbo/lib/libjpeg.* \
             2>/dev/null | grep -q .
          ls /opt/libjpeg-turbo/lib64/libturbojpeg.* /opt/libjpeg-turbo/lib/libturbojpeg.* \
             2>/dev/null | grep -q .
      - name: Run full test suite with AVX2 disabled at compile time
        run: cargo test --tests
        timeout-minutes: 45

  # Runs the SIMD-sensitive tests under an emulated pre-AVX2 CPU, so
  # `is_x86_feature_detected!("avx2")` genuinely returns false and the SSE2 /
  # scalar fallback kernels execute.
  #
  # `EXPECT_NO_AVX2=1` makes the leg self-verifying: if the emulation ever
  # stops masking the feature, `simd_dispatch_capability` fails rather than
  # passing while silently testing the AVX2 path — which is exactly how the
  # previous compile-time-only job gave false confidence (#320).
  #
  # Scoped to tests that do not shell out to the C tools: `qemu-user`
  # intercepts `execve`, so subprocessing native `cjpeg`/`djpeg` from an
  # emulated process is not a like-for-like comparison. The C cross-checks run
  # natively in the other legs.
  test-linux-x86_64-no-avx2-emulated:
    name: Test (linux-x86_64 no-AVX2, emulated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          qemu-x86_64 --version
      # `--lib` rides along so the in-module SIMD suites — including the
      # P4-135 wrapper test `feature_checked_wrappers_match_scalar_on_any_cpu`
      # — execute their no-AVX2 fallback arms on a CPU that genuinely lacks
      # the feature; no other CI leg runs the lib tests without AVX2.
      - name: Build test binaries
        run: |
          cargo test --release --no-run --lib \
            --test simd_dispatch_capability \
            --test encode_pipeline_golden \
            --test encode_option_matrix \
            --test encode_params_composability
      - name: Run under an emulated Nehalem (SSE4.2, no AVX)
        env:
          EXPECT_NO_AVX2: "1"
        run: |
          set -euo pipefail
          # -cpu Nehalem predates AVX entirely, so CPUID reports no AVX2 and
          # the runtime dispatch takes the fallback.
          cargo test --release --no-run --lib --message-format=json \
            --test simd_dispatch_capability \
            --test encode_pipeline_golden \
            --test encode_option_matrix \
            --test encode_params_composability \
            | jq -r 'select(.executable != null) | .executable' \
            | while read -r binary; do
                echo "=== $binary ==="
                qemu-x86_64 -cpu Nehalem "$binary" --nocapture
              done
        timeout-minutes: 45

  # WASM SIMD128 smoke — runs on every PR. Build-only for `wasm-pack
  # build --release --target web` is the baseline guarantee; the
  # `wasm-pack test --node --release` step adds runtime assertions when
  # the WASM test harness is available.
  wasm-simd128-smoke:
    name: WASM SIMD128 smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM crate (web target, release)
        run: cd crates/libjpeg-turbo-rs-wasm && wasm-pack build --release --target web
        timeout-minutes: 20
      - name: Run wasm-bindgen tests on Node (release)
        run: cd crates/libjpeg-turbo-rs-wasm && wasm-pack test --node --release
        timeout-minutes: 30
