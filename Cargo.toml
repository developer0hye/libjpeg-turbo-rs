[workspace]
members = [".", "crates/libjpeg-turbo-rs-wasm", "crates/libjpeg-turbo-rs-image", "crates/libjpeg-turbo-rs-capi"]

[package]
name = "libjpeg-turbo-rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.87"
description = "Pure Rust reimplementation of libjpeg-turbo with NEON/AVX2 SIMD acceleration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/developer0hye/libjpeg-turbo-rs"
readme = "README.md"
keywords = ["jpeg", "image", "simd", "encoder", "decoder"]
categories = ["multimedia::images", "multimedia::encoding"]
exclude = [
    "references/",
    "tests/fixtures/",
    "examples/",
    "benches/",
    "docs/",
    "experiments/",
    "bench_c_*",
    "*.md",
    "!README.md",
    ".github/",
    "ralph/",
]

[features]
default = ["simd"]
simd = []
full-c-parity = []
# Optional PNG support for tj3LoadImage8 / tj3SaveImage8. Off by default so
# the codec crate stays small. Enable with --features png.
png = ["dep:png"]

[dependencies]
thiserror = "2"
png = { version = "0.17", optional = true }

[dev-dependencies]
zune-jpeg = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# Loom permutation testing for concurrency stress (gated behind `--cfg loom`).
# Activate: `RUSTFLAGS="--cfg loom" cargo test --release`.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "encode"
harness = false

[profile.release]
lto = true
