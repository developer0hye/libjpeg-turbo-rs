name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib
      # The user-facing examples are documentation (issue #388); keep
      # them compiling.
      - run: cargo check --examples

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  # Mutation-tests only the lines this PR changed. Fast, because
  # `--in-diff` restricts the mutant set to the diff rather than the 3807
  # mutants `src/encode/pipeline.rs` carries in total.
  #
  # Non-blocking: a surviving mutant is sometimes an equivalent mutant, which
  # is a judgement call rather than a defect. Failing the build on it would
  # train people to ignore the job. The output is there to be read at review
  # time — untested new code, flagged when it is cheap to fix (#325).
  mutants-in-diff:
    name: Mutation test (changed lines)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      # The encode cross-checks are the oracle that catches most encoder
      # mutants. Without the C tools they skip, and a mutant only detectable by
      # a byte-comparison against cjpeg reports as MISSED for the wrong reason.
      - name: Install libjpeg-turbo 3.x from official release
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.1.4.1
          curl -fL -o /tmp/ljt.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/ljt.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
      - name: Build the diff against the base branch
        run: |
          git diff "origin/${{ github.base_ref || 'main' }}"...HEAD > /tmp/pr.diff
          wc -l /tmp/pr.diff
      # Bounded on purpose. A large diff can produce hundreds of mutants, each
      # rebuilding and re-running three test binaries, and the first PR to
      # touch `compress_cmyk` blew straight through the 30-minute step limit —
      # a job that times out reports "fail" and tells the reader nothing. So
      # the work is capped at what fits, and whatever is skipped is announced
      # rather than quietly dropped.
      - name: Mutate only the changed lines
        run: |
          set -uo pipefail
          TOTAL=$(cargo mutants --in-diff /tmp/pr.diff --list 2>/dev/null | wc -l)
          echo "$TOTAL mutants in the changed lines"
          # Each mutant costs a full rebuild — measured at ~3 minutes on a
          # hosted runner — so the budget is about ten, not the ninety this
          # first guessed at. Guessing wrong is why PR #348 still timed out
          # after the bound was added.
          BUDGET=10
          SHARDS=$(( (TOTAL + BUDGET - 1) / BUDGET ))
          if [ "$SHARDS" -lt 1 ]; then SHARDS=1; fi
          if [ "$SHARDS" -gt 1 ]; then
            echo "::warning::$TOTAL mutants exceed this job's budget; testing shard 0/$SHARDS (~$BUDGET) and skipping the other $(( TOTAL - TOTAL / SHARDS )). A clean result here does NOT mean the whole diff was checked."
          fi
          cargo mutants --in-diff /tmp/pr.diff --shard "0/$SHARDS" -j 4 --timeout 300 \
            --cargo-test-arg --test --cargo-test-arg encode_pipeline_golden \
            --cargo-test-arg --test --cargo-test-arg encode_option_matrix \
            --cargo-test-arg --test --cargo-test-arg encode_input_validation \
            --cargo-test-arg --test --cargo-test-arg regression_rgb_direct_options \
            --cargo-test-arg --test --cargo-test-arg regression_cmyk_c_parity \
            || true
          echo "--- surviving mutants (review these) ---"
          cat mutants.out/missed.txt 2>/dev/null || echo "(none)"
        timeout-minutes: 45

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --all-targets compiles test binaries that include_bytes!
          # fixtures out of references/libjpeg-turbo (e.g. testorig.jpg).
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Library and bin code: zero allowances.
      - run: cargo clippy --workspace -- -D warnings
      # Tests/benches/examples too (issue #390). Three structural lints are
      # allowed in test code only — the sites are enumerated in
      # docs/last_mile/phase4.md P4-70; do not grow the list.
      - run: >
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::needless_range_loop
          -A clippy::too_many_arguments
          -A clippy::type_complexity

  # The unattended issue loop drives development itself, so a syntax error or a
  # broken transcript reader in it stalls work silently rather than failing a
  # build. Both checks are seconds long.
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/issue_loop.sh
      # P4-130's currency check runs weekly from upstream-currency.yml, where a
      # syntax error would surface as a red scheduled job nobody is watching.
      - run: bash -n scripts/check_oracle_currency.sh
      - run: python3 -m unittest discover -s scripts/tests -p 'test_issue_loop_watch.py'

  # Proves each declared `rust-version` actually compiles (issue #390).
  # A single workspace-wide 1.87 check is impossible: the image-bridge
  # crate inherits image@0.25's rustc 1.88 floor, so it declares
  # rust-version 1.88 and gets its own pinned leg (codex P2: checking it
  # only on latest stable would let post-1.88 APIs slip past CI).
  msrv:
    name: MSRV (1.87 root/capi, 1.88 image bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.87 check -p libjpeg-turbo-rs --all-features
      - run: cargo +1.87 check -p libjpeg-turbo-rs --no-default-features
      - run: cargo +1.87 check -p libjpeg-turbo-rs-capi
      - run: cargo +1.88 check -p libjpeg-turbo-rs-image

  # Supply-chain gate (issue #390): advisories, licenses, duplicate majors,
  # untrusted sources. Policy lives in deny.toml. `--workspace` because the
  # root manifest is itself a package — without it cargo-deny roots the
  # graph at `libjpeg-turbo-rs` only and skips violations introduced
  # solely through the capi/image/wasm members (codex P2).
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features --workspace

  no-std:
    name: no_std + alloc build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Bare-metal target: proves the core codec links without std,
      # not merely that it compiles on a std-capable host (issue #356).
      - name: Build core codec without std
        run: cargo build --lib --no-default-features --target thumbv7em-none-eabihf
      - name: Build without std but with SIMD feature
        run: cargo build --lib --no-default-features --features simd --target thumbv7em-none-eabihf
      # The default (std) build must be unaffected.
      - name: Default features still build
        run: cargo build --lib

  publish-check:
    # Issue #380: the image/wasm bridge crates shipped with path-only
    # dependencies on the root crate and could not be published — the
    # `image`-bridge adoption channel simply did not exist on crates.io.
    # Two gates, because modern cargo (>=1.90) only WARNS on a missing
    # `version` key and infers one at package time:
    # 1. an explicit manifest assertion that every intra-workspace `path`
    #    dependency in crates/*/Cargo.toml carries a `version` key;
    # 2. `cargo package --no-verify` for each publishable member
    #    (--no-verify because the workspace version may not be on
    #    crates.io yet — this gates manifest shape, not registry state).
    name: Publish check (manifest + cargo package)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Intra-workspace path deps must carry a version key
        # Parsed as TOML (not grepped) so table-syntax deps
        # ([dependencies.foo] with path/version on separate lines) are
        # judged correctly. Dev-dependencies are exempt: cargo strips
        # versionless path dev-deps at publish time.
        run: |
          python3 - <<'EOF'
          import glob, sys, tomllib
          bad = 0
          for manifest in glob.glob("crates/*/Cargo.toml"):
              with open(manifest, "rb") as fh:
                  data = tomllib.load(fh)
              for section in ("dependencies", "build-dependencies"):
                  for name, spec in (data.get(section) or {}).items():
                      if isinstance(spec, dict) and "path" in spec and "version" not in spec:
                          print(f"::error file={manifest}::{section}.{name} has a path dependency without a version key (issue #380)")
                          bad = 1
          sys.exit(bad)
          EOF
      - name: cargo package every publishable member
        # --exclude-lockfile as well as --no-verify: lockfile generation
        # resolves the packaged `version = "0.8.0"` deps against
        # crates.io, which fails whenever the workspace version is ahead
        # of the published one (the normal state between releases).
        run: |
          set -euo pipefail
          for crate in libjpeg-turbo-rs libjpeg-turbo-rs-capi libjpeg-turbo-rs-image libjpeg-turbo-rs-wasm; do
            echo "::group::$crate"
            cargo package --no-verify --exclude-lockfile -p "$crate"
            echo "::endgroup::"
          done
      - name: Bridge feature wiring (isolated resolution, issue #381)
        # Must be `-p`: whole-workspace builds unify the root crate's
        # default `std` feature and would mask a bridge manifest that
        # drops it. `-p` resolves features exactly like a crates.io
        # consumer of the bridge does.
        run: cargo test -p libjpeg-turbo-rs-image

  miri:
    # Issue #389: interpret the non-SIMD unit tests under Miri. The simd
    # feature is off and simd:: module tests are skipped — Miri cannot
    # emulate vendor intrinsics — so this checks exactly the safe-Rust +
    # non-SIMD-unsafe surface (uninit-Vec patterns, BitWriter, parsing).
    # -Zmiri-disable-isolation because fixture-reading tests stat files.
    name: Miri (non-SIMD unit tests)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Quoted: a plain YAML scalar may not end in `:`; GitHub's parser
      # tolerates it but strict YAML tooling (PyYAML, actionlint) rejects
      # the whole file.
      - run: "cargo miri test --no-default-features --features std --lib -- --skip simd::"
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        timeout-minutes: 25
      # P4-110: the create guards are a memory-safety fix whose claim is
      # "no reference is ever formed over memory the caller did not
      # allocate". Only Miri can check that — the suite allocates exactly
      # the declared size, so an oversized borrow is a hard error rather
      # than an accident that happens to land inside a canary. The two
      # tests that spawn a process (C oracle, abort-in-child) carry
      # `cfg_attr(miri, ignore)`.
      #
      # Its own `env`/`timeout-minutes`: a step's settings belong to the step
      # above them in YAML, so appending a bare `run` here would have silently
      # taken both from the library run.
      - run: >
          cargo miri test -p libjpeg-turbo-rs-capi
          --test capi_create_abi_guards
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        timeout-minutes: 25

  test-lib:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check, test-lib]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.x from official release (matches macOS homebrew; apt ships 2.1.x lacking -lossless/-precision/SOF3)
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.1.4.1
          curl -fL -o /tmp/ljt.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get install -y /tmp/ljt.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
      - name: Verify C tools on PATH (expect libjpeg-turbo 3.x)
        run: |
          export PATH="/opt/libjpeg-turbo/bin:$PATH"
          djpeg -version
          cjpeg -version
          jpegtran -version
      - run: cargo test --tests
        timeout-minutes: 30
      # P4-82/P4-83 live in the non-default C-ABI workspace member, so the
      # root-only command above does not select their stock-cjpeg matrix. Run
      # the complete fast binary so a renamed/deleted test cannot pass as a
      # zero-test positional-filter match (P4-61).
      - name: Classic C-ABI scanline option parity
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_jpeglib_encode -- --nocapture
      # P4-139's span guards. Named explicitly for the reason the P4-81 note
      # below records from experience: tests in this crate are selected by
      # name, so a suite nothing names never runs and reports green forever.
      - name: Classic C-ABI span overflow guards (P4-139)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_span_overflow_guards
          --test norealloc_buffer_capacity
          --test yuv_packed_length_overflow -- --nocapture
      # P4-146's error-message gates, plus the error-code cross-check they
      # extend. `capi_classic_error_codes` was never named here either — it
      # compiled on every PR and executed on none, which is precisely how it
      # reported "18 codes verified" through the entire period when all 18
      # rendered as "bogus message code".
      - name: Classic C-ABI error codes and message rendering (P4-146)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_classic_error_codes
          --test capi_error_message_rendering
          --test capi_output_message
          --test capi_max_memory_budget -- --nocapture
      # The C-ABI crate's OWN unit tests, on the stable toolchain.
      #
      # `cargo test --lib` in the Unit Tests job selects the default workspace
      # member only — the root crate — so these 24 tests do not run there.
      # They are not uncovered: `sanitizers.yml` runs `cargo test --workspace
      # --lib` under ASan and UBSan on every PR. What this adds is a stable,
      # *uninstrumented* run, so a failure here is not confounded with
      # sanitizer instrumentation and does not depend on that workflow.
      #
      # Includes P4-104's `every_state_constant_matches_upstream_jpegint_h`,
      # which cross-checks all 15 `global_state` values against the pinned
      # `jpegint.h` with exact accounting, so a 16th upstream state fails
      # rather than passing unnoticed.
      - name: C-ABI crate unit tests (stable, uninstrumented)
        run: cargo test -p libjpeg-turbo-rs-capi --lib
      # P4-13/P4-17's documented suspension proof is also in the C-ABI
      # workspace member. Its helper requires cjpeg/djpeg in CI and compilation
      # or oracle failures are fatal, so this cannot report green after a skip.
      - name: Classic C-ABI pathological lifecycle parity
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_classic_lifecycle_pathological
          --test capi_suspended_body_cap -- --nocapture
        env:
          # This suite resolves its stock tools itself, and its search order
          # reads /opt/homebrew and /usr before /opt/libjpeg-turbo. On this
          # runner only the baseline install exists, so it landed on the right
          # one by absence rather than by choice — and the same code on the
          # 3.2.0 leg would have measured whatever else was present. Naming the
          # prefix makes both legs say which release they mean; the lookup
          # treats it as exclusive.
          LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo
      # P4-81: the ELF symbol-version leg. This crate's tests are selected by
      # name here, so a suite that is never named never runs -- which is exactly
      # what happened to this one: it reported green on two full CI runs without
      # executing, because nothing invoked it. It stages the library through
      # scripts/install_capi.sh itself and asserts the relink happened, so a
      # degraded install fails rather than skipping. Linux-only: GNU symbol
      # versioning is an ELF feature.
      - name: Classic C-ABI GNU symbol versions (P4-81)
        run: |
          set -o pipefail
          cargo test -p libjpeg-turbo-rs-capi \
            --test capi_symbol_versions -- --nocapture 2>&1 | tee p481.log
          # The ELF assertions are the point of this leg; a skip means they did
          # not run and the nodes are unverified.
          if grep -q '^SKIP' p481.log; then
            echo "P4-81 symbol-version checks skipped in CI; this leg must run here" >&2
            grep '^SKIP' p481.log >&2
            exit 1
          fi
      # P4-108's destination canaries are differential: one C binary is linked
      # against our cdylib and against a reference libjpeg, and the two
      # contract reports must be byte-identical. Build the *pinned submodule*
      # with WITH_JPEG8=1 so the oracle is the same v8 ABI the shim claims,
      # rather than whatever libjpeg the runner image happens to ship.
      - name: Build the pinned reference libjpeg-turbo at the v8 ABI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm
          cmake -S references/libjpeg-turbo -B /tmp/ljt8/build \
            -DCMAKE_BUILD_TYPE=Release -DWITH_JPEG8=1 \
            -DCMAKE_INSTALL_PREFIX=/tmp/ljt8/prefix
          cmake --build /tmp/ljt8/build -j"$(nproc)"
          cmake --install /tmp/ljt8/build
          grep -Eq '^#define[[:space:]]+JPEG_LIB_VERSION[[:space:]]+80$' \
            /tmp/ljt8/prefix/include/jconfig.h
      # Ubuntu also provides /dev/full, so the fflush/ferror scenario runs for
      # real here instead of reporting itself unavailable as it does on macOS.
      # P4-104's transition work. Named for the same reason as the suites
      # above: this crate's tests are selected by name.
      #
      # Two of these compare their `(return code, global_state)` traces against
      # `examples/consume_input_states_oracle.c` linked to a real C libjpeg,
      # and skip silently without a development install. Pointing
      # LIBJPEG_TURBO_PREFIX at the *pinned submodule* build above makes the
      # oracle both mandatory and version-exact: the C the traces are compared
      # against is the same source tree the citations in those tests quote,
      # not whatever libjpeg the runner image ships. This step therefore has to
      # follow that build.
      # P4-110's create-time ABI guards, the last P0. The suite compares the
      # shim's whole (code, parameters, canary, preserved-fields) behaviour
      # against `examples/create_abi_guards_oracle.c` linked to the pinned
      # reference built above, so the prefix is what makes the comparison
      # mandatory rather than skippable.
      # P4-145: the six compressing entry points honour TJPARAM_NOREALLOC.
      # Named because this crate's tests are selected by name, and the whole
      # assertion is pointer identity — a suite that never runs proves nothing
      # about it.
      # P4-147: the restart-marker cost ratio is `#[ignore]`d out of the
      # default suite and run here **serially**. `cargo test` parallelises
      # binaries and threads; a timing comparison under that is a coin flip,
      # which is exactly how the old absolute bound produced a failure blaming
      # a regression that had not happened.
      #
      # This covers `worker_b8_restart_bomb` only. Five absolute wall-clock
      # assertions remain in the default suite —
      # `worker_b8_huffman_bomb.rs:213`, `worker_b8_memory_bounds.rs:82,99`,
      # `worker_b8_progressive_bomb.rs:188,234` — with the same contention
      # failure mode. They are tracked as P4-152, not fixed here: P4-147 is
      # scoped to the test that actually flaked, and each of the others needs
      # its own answer to "what is the deterministic measure?".
      - name: Timing ratios, serial (P4-147, P4-152)
        run: >
          cargo test --release
          --test worker_b8_restart_bomb
          --test worker_b8_progressive_bomb
          --test hard_case_x_byte_and_restart --
          --include-ignored --test-threads=1
        # Every timing assertion in the suite runs here and nowhere else, so a
        # ratio is never taken while sibling test binaries compete for the same
        # cores — a ratio cancels machine speed, but not contention.
        #
        # P4-147: the restart-marker cost ratio.
        # P4-152: the progressive bomb's scan-loop scaling and scan-limit
        # fail-fast ratios, plus `restart_bomb_4096_terminates_within_budget`,
        # a 60 s liveness bound moved out of the parallel run.
        #
        # Sub-second once built, except the 4096² restart bomb. A generous cap
        # that still fails promptly: the regression P4-147 guards is an
        # `O(MCUs * RST)` scan over 65,536 restarts, which does not slow the
        # decode — it hangs it, and without a cap the ratio assertion is never
        # reached and the runner sits until the job limit.
        timeout-minutes: 15

      - name: TurboJPEG NOREALLOC ownership (P4-145)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test norealloc_all_entry_points
          --test norealloc_buffer_capacity -- --nocapture
        env:
          # One of these compares the whole ownership trace against real
          # TurboJPEG. It skips without a development install, and skipping is
          # how the NULL-slot divergence survived the first version of this
          # fix — every self-consistent assertion accepted it.
          LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo

      - name: TurboJPEG compress precision rules (P4-150)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_compress_precision -- --nocapture
        env:
          # Which precisions upstream accepts is decided by libjpeg two calls
          # below TurboJPEG, so the rule is invisible in the layer the entry
          # point lives in. Reading that layer alone is what produced the bug;
          # only the oracle comparison catches a repeat, and it skips without a
          # development install.
          LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo

      - name: Classic C-ABI create guards (P4-110)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_create_abi_guards -- --nocapture
        env:
          LIBJPEG_TURBO_PREFIX: /tmp/ljt8/prefix

      # P4-154 (#538): the data_precision matrix, stage + code + parm + exact
      # output bytes, against the stock libjpeg the step above provisioned.
      # Named explicitly for the standing reason: a suite nothing names never
      # runs and reports green forever.
      - name: Classic C-ABI data_precision gates (P4-154)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_classic_compress_precision -- --nocapture
        env:
          LIBJPEG_TURBO_PREFIX: /tmp/ljt8/prefix

      - name: Classic C-ABI state transitions (P4-104)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_input_complete_contract
          --test capi_consume_input_states
          --test capi_preload_resume
          --test capi_classic_lifecycle_state
          --test capi_classic_source_mgr
          --test capi_resync_suspend -- --nocapture
        env:
          # capi_classic_lifecycle_state is the P4-104/P4-106 (#468)
          # differential trace — 17 lines compared verbatim against a stock
          # libjpeg oracle. capi_classic_source_mgr (P4-109) and
          # capi_resync_suspend (P4-97) are the #469 differential traces —
          # source-manager setup/stdio semantics and suspending-source
          # resync — compared the same way. Without the prefix all three
          # soft-skip, which is exactly the vacuous green this step exists
          # to prevent.
          LIBJPEG_TURBO_PREFIX: /tmp/ljt8/prefix

      - name: Classic destination ownership + stdio I/O parity (P4-108)
        env:
          LIBJPEG_TURBO_REFERENCE_DIR: /tmp/ljt8/prefix
        run: |
          set -o pipefail
          cargo test -p libjpeg-turbo-rs-capi \
            --test capi_classic_dest_ownership -- --nocapture 2>&1 | tee p4108.log
          # A missing reference build would silently drop the differential half
          # of every case, so fail closed on any skip line.
          if grep -q '^SKIP' p4108.log; then
            echo "P4-108 canaries skipped in CI; the reference leg is required here" >&2
            grep '^SKIP' p4108.log >&2
            exit 1
          fi
          grep -q 'dev_full_available=1' p4108.log || {
            echo "expected /dev/full to be exercised on ubuntu-latest" >&2
            exit 1
          }
      # P4-125's guard, P4-126/P4-128's plane-dimension matrix, and their C
      # oracles also live in the C-ABI workspace member, so `cargo test --tests`
      # above does not select them. Name each binary in full rather than
      # filtering, so a renamed or deleted test cannot report green as a
      # zero-test match (P4-61). The oracles need the turbojpeg headers the
      # install step above put in /opt/libjpeg-turbo; LIBJPEG_TURBO_PREFIX names
      # that prefix exclusively and makes them mandatory, so a missing or
      # TurboJPEG-2.x install fails this step instead of skipping it.
      - name: TurboJPEG YUV component-count guard and C parity
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test yuv_four_component_guard
          --test yuv_decompress_planes_component_guard
          --test yuv_four_component_c_parity
          --test yuv_plane_index_c_parity
          --test yuv_validate_before_decode -- --nocapture
        env:
          LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo

  # P4-130 criterion 1: the same differential matrix, against current upstream
  # stable. The job above is the behaviour-regression leg at 3.1.4.1 — the
  # release the existing expectations were written against — and this is the
  # current-parity leg. Two legs rather than one bumped pin, because a bump
  # re-baselines every expectation at once: a divergence it papered over would
  # be indistinguishable from a pass, and the whole point of a differential
  # gate is that the two cases are distinguishable.
  #
  # The oracle is named by LIBJPEG_TURBO_PREFIX, not by PATH order. PATH cannot
  # say it: `tests/helpers::c_tool_path` reads /opt/homebrew/bin first, so the
  # ordering that works on a Linux runner silently does not on macOS, and a
  # missing tool falls through to any other djpeg on the box. The prefix is
  # exclusive — no tool under it means no tool, not a quiet fallback to the
  # 3.1.4.1 install this job would otherwise be measuring while claiming 3.2.0.
  #
  # Versions live in docs/oracle_versions.tsv; tests/oracle_version_pins.rs
  # fails if this pin is not declared there, or if a declared leg does not run.
  test-integration-current-oracle:
    name: Integration Tests (oracle 3.2.0)
    runs-on: ubuntu-latest
    needs: [check, test-lib]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.2.0 from official release
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.2.0
          curl -fL -o /tmp/ljt320.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get install -y /tmp/ljt320.deb
          # LIBJPEG_TURBO_PREFIX is what *selects* the oracle; PATH is here so
          # that anything not going through the test helpers — a shell script, a
          # future call site — reaches the same install rather than nothing.
          # It cannot reintroduce ambiguity: 3.2.0 is the only libjpeg-turbo on
          # this runner, so PATH and the prefix cannot disagree about a version.
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
      # The version this leg is named for has to be the version it runs. A deb
      # that installed something else, or a prefix that resolved elsewhere,
      # would otherwise produce a green "3.2.0" leg measuring 3.1.4.1.
      #
      # The headers and libraries are checked too, not just the tools: some
      # suites compile a C oracle rather than shelling out to djpeg, and the
      # prefix is exclusive for those as well (helpers::c_oracle::dev_prefixes).
      # A prefix holding tools but no development files fails the run — which
      # is the point, since the alternative was compiling against /usr's 2.1.x
      # and calling the result a 3.2.0 comparison.
      - name: Verify the oracle really is 3.2.0
        run: |
          /opt/libjpeg-turbo/bin/djpeg -version 2>&1 | tee /tmp/oracle-version.txt
          grep -q "version 3.2.0" /tmp/oracle-version.txt
          /opt/libjpeg-turbo/bin/cjpeg -version 2>&1 | grep -q "version 3.2.0"
          /opt/libjpeg-turbo/bin/jpegtran -version 2>&1 | grep -q "version 3.2.0"
          test -f /opt/libjpeg-turbo/include/jpeglib.h
          test -f /opt/libjpeg-turbo/include/turbojpeg.h
          ls /opt/libjpeg-turbo/lib64/libjpeg.* /opt/libjpeg-turbo/lib/libjpeg.* \
             2>/dev/null | grep -q .
          ls /opt/libjpeg-turbo/lib64/libturbojpeg.* /opt/libjpeg-turbo/lib/libturbojpeg.* \
             2>/dev/null | grep -q .
      - run: cargo test --tests
        env:
          LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo
        timeout-minutes: 30

      # The C-ABI crate's oracle suites, at the current-parity oracle.
      #
      # `cargo test --tests` above is the root crate, so without these steps
      # this leg measured the root differential matrix and nothing of the
      # classic-`jpeg_*` / TurboJPEG shim — the half of this repository whose
      # whole contract is "what stock libjpeg does", and therefore the half
      # with the most to say about a new upstream release.
      #
      # Which suites belong here is not a judgement call maintained in prose:
      # `tests/oracle_version_pins.rs` reads each baseline-leg suite's own
      # source for a C-oracle marker and fails if one of them is missing from
      # this job. What stays behind is everything self-contained: the four capi
      # steps duplicated nowhere here — the span-overflow guards, the
      # error-code and message-rendering gates, the crate's unit tests, the ELF
      # symbol-version leg — plus the self-contained suites riding inside the
      # mixed steps above (capi_input_complete_contract, capi_suspended_body_cap,
      # norealloc_buffer_capacity, yuv_packed_length_overflow and the three
      # yuv_*_guard/validate suites). All of them compare against constants, our
      # own generated files, or the pinned headers, so a second run at another
      # upstream release would measure the same thing twice.
      - name: C-ABI TurboJPEG and stock-tool oracles (3.2.0)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_jpeglib_encode
          --test capi_classic_lifecycle_pathological
          --test capi_compress_precision
          --test norealloc_all_entry_points
          --test yuv_four_component_c_parity
          --test yuv_plane_index_c_parity -- --nocapture
        env:
          # Exclusive, as on every other oracle step: a suite that cannot find
          # its tool under this prefix fails instead of falling back to some
          # other djpeg and reporting a 3.2.0 result it did not measure.
          LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo

      # The classic-ABI trace suites compile a C oracle and compare traces line
      # by line, and they need the v8 ABI the shim claims. Upstream's official
      # deb ships JPEG_LIB_VERSION 62, so the install above cannot serve them
      # however current it is; only a WITH_JPEG8=1 build of the sources can.
      #
      # The baseline leg builds the *submodule* for this role — 3.1.90, the
      # beta1 of the current line, per docs/oracle_versions.tsv, which is the
      # release each row's version is declared in. Bumping that submodule is a
      # separate change with its own drift audit, because it moves every
      # `j*.c:NNN` citation in this repository at the same time. Building 3.2.0
      # beside it moves the trace comparison to current upstream stable without
      # touching a single citation.
      - name: Build libjpeg-turbo 3.2.0 at the v8 ABI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm
          git clone --depth 1 --branch 3.2.0 \
            https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/ljt320src
          # A tag is a moveable name, and this grep catches exactly one way it
          # can move: a tag repointed at a *different release* fails here
          # instead of building an older tree under this label. It does not
          # detect a tag repointed at a modified tree of the same release —
          # that residual exposure is the one every oracle here carries, since
          # the deb downloads are unverified too, and it is tracked as its own
          # gap rather than solved for one step (P4-176).
          grep -Eq '^set\(VERSION 3\.2\.0\)$' /tmp/ljt320src/CMakeLists.txt
          cmake -S /tmp/ljt320src -B /tmp/ljt320v8/build \
            -DCMAKE_BUILD_TYPE=Release -DWITH_JPEG8=1 \
            -DCMAKE_INSTALL_PREFIX=/tmp/ljt320v8/prefix
          cmake --build /tmp/ljt320v8/build -j"$(nproc)"
          cmake --install /tmp/ljt320v8/build
          grep -Eq '^#define[[:space:]]+JPEG_LIB_VERSION[[:space:]]+80$' \
            /tmp/ljt320v8/prefix/include/jconfig.h
        timeout-minutes: 20

      - name: Classic C-ABI state, create and precision traces (3.2.0)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_create_abi_guards
          --test capi_classic_compress_precision
          --test capi_consume_input_states
          --test capi_preload_resume
          --test capi_classic_lifecycle_state
          --test capi_classic_source_mgr
          --test capi_resync_suspend -- --nocapture
        env:
          LIBJPEG_TURBO_PREFIX: /tmp/ljt320v8/prefix

      - name: Classic destination ownership + stdio I/O parity (3.2.0)
        env:
          LIBJPEG_TURBO_REFERENCE_DIR: /tmp/ljt320v8/prefix
        run: |
          set -o pipefail
          cargo test -p libjpeg-turbo-rs-capi \
            --test capi_classic_dest_ownership -- --nocapture 2>&1 | tee p4108-320.log
          # Same fail-closed rule as the baseline leg: a missing reference build
          # drops the differential half of every case silently.
          if grep -q '^SKIP' p4108-320.log; then
            echo "P4-108 canaries skipped on the 3.2.0 leg; the reference build is required here" >&2
            grep '^SKIP' p4108-320.log >&2
            exit 1
          fi
          grep -q 'dev_full_available=1' p4108-320.log || {
            echo "expected /dev/full to be exercised on ubuntu-latest" >&2
            exit 1
          }

  test-cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  test-windows-workspace:
    # Issue #378 / P4-62: no job built the integration or capi test
    # targets on windows-msvc, so an MSVC-only link failure (the UCRT
    # does not export `snprintf`; format_message.rs binds it as its
    # printf oracle) shipped unseen and `cargo test --workspace` could
    # not even BUILD on a Windows host. This job:
    # 1. builds every workspace test target (`--no-run`), which is where
    #    LNK2019 surfaces — the next Windows-only link break fails here;
    # 2. runs the two suites the defect and its sibling live in, both
    #    deliberately C-tool-free: the capi printf-expansion oracle and
    #    the allocation budgets (whose gray_8x8 case measures 9 allocs
    #    on Windows, pinned per-platform in the test).
    # The full suite is NOT run here: the C cross-validation tests
    # hard-fail in CI when djpeg/cjpeg are absent, and provisioning
    # libjpeg-turbo tools on the Windows runner is its own project.
    name: Workspace build + targeted tests (windows)
    runs-on: windows-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build every workspace test target
        run: cargo test --workspace --no-run
        timeout-minutes: 30
      - name: Printf-expansion oracle (issue #378 fix)
        run: cargo test -p libjpeg-turbo-rs-capi --test format_message -- --nocapture
        timeout-minutes: 10
      - name: Allocation budgets (P4-62 sibling re-measure)
        run: cargo test -p libjpeg-turbo-rs --test alloc_budget_small_decode -- --nocapture
        timeout-minutes: 10

  capi-abi-checks:
    # P2-3 / P2-4 / P2-5: per-platform C-ABI structural validation.
    #
    # Two structural cross-checks against the libjpeg-turbo submodule:
    #
    # 1. `abi_offsets` — compiles a C harness against the submodule's
    #    `jpeglib.h` and asserts every const-asserted Rust offset
    #    equals the C-side `offsetof` on the host (catches struct
    #    layout drift in either direction).
    # 2. `symbol_inventory` — parses upstream `jpeglib.h` and
    #    `turbojpeg.h` for `EXTERN(...)` / `DLLEXPORT` declarations,
    #    dlopens our cdylib, and asserts every declared symbol is
    #    resolvable (catches drop-in surface drift). An explicit
    #    allowlist enumerates intentionally-deferred legacy symbols.
    #
    # Running both on ubuntu-latest (Linux x86_64 LP64),
    # macos-latest (aarch64 LP64), and windows-latest (x86_64 MSVC
    # LLP64) covers the three ABI flavours downstream consumers
    # care about. Each host probes its own ABI.
    #
    # Skip-with-reason on hosts where the gate trips (no cc on PATH,
    # 32-bit host that the Rust assertion block doesn't pin yet) —
    # those tests exit 0 with an `eprintln!("SKIP: ...")`.
    name: CAPI ABI Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ABI offset cross-check (P2-4)
        run: cargo test -p libjpeg-turbo-rs-capi --release --test abi_offsets -- --nocapture
        timeout-minutes: 10
      - name: Symbol inventory diff (P2-5)
        run: cargo test -p libjpeg-turbo-rs-capi --release --test symbol_inventory -- --nocapture
        timeout-minutes: 10

  test-cross-encode:
    name: C Interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest  # aarch64
            install: brew install jpeg-turbo
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo tools
        run: ${{ matrix.install }}
      # Full test run, deliberately unfiltered (issue #377, P4-61). The old
      # `cargo test "cross_encode|cross_check" --tests` matched nothing:
      # libtest's positional filter is a substring match against test NAMES
      # (not a regex, not file names), and the tests inside the
      # cross_check_*/cross_encode_* files have names like
      # c_xval_decode_bgr_444 — so the job built every test binary and ran
      # zero tests. Even the corrected multi-filter form
      # (`-- cross_encode cross_check`) selects only 8 tests by name.
      # This job's unique coverage is the C-tool environment: aarch64 +
      # Homebrew jpeg-turbo 3.x, the only such leg in CI. The former
      # ubuntu-latest leg is gone: with apt's 2.1.x tools the suite cannot
      # run (tests feed SOF3/12-bit streams to djpeg unconditionally), and
      # installing the official 3.1.4.1 deb would make it an exact duplicate
      # of the Integration Tests job.
      - run: cargo test --tests
        timeout-minutes: 30

  test-corpus:
    name: Corpus Test (C parity)
    runs-on: ubuntu-latest
    needs: [test-cross-encode]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build libjpeg-turbo 3.1.4.1 from source
        run: |
          sudo apt-get install -y cmake nasm
          git clone --depth 1 --branch 3.1.4.1 https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/ljt
          cmake -S /tmp/ljt -B /tmp/ljt/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/ljt/build -j$(nproc)
          sudo cmake --install /tmp/ljt/build
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: Generate corpus
        run: cargo run --release --example generate_corpus
        timeout-minutes: 15
      - name: Run corpus test
        run: |
          if ! cargo run --release --example corpus_test -- --corpus-dir tests/corpus/ > corpus-test.tsv 2>&1; then
            tail -200 corpus-test.tsv
            exit 1
          fi
          tail -5 corpus-test.tsv
        timeout-minutes: 30

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
