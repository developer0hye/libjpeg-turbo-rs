name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib
      # The user-facing examples are documentation (issue #388); keep
      # them compiling.
      - run: cargo check --examples

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  # Mutation-tests only the lines this PR changed. Fast, because
  # `--in-diff` restricts the mutant set to the diff rather than the 3807
  # mutants `src/encode/pipeline.rs` carries in total.
  #
  # Non-blocking: a surviving mutant is sometimes an equivalent mutant, which
  # is a judgement call rather than a defect. Failing the build on it would
  # train people to ignore the job. The output is there to be read at review
  # time — untested new code, flagged when it is cheap to fix (#325).
  mutants-in-diff:
    name: Mutation test (changed lines)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      # The encode cross-checks are the oracle that catches most encoder
      # mutants. Without the C tools they skip, and a mutant only detectable by
      # a byte-comparison against cjpeg reports as MISSED for the wrong reason.
      - name: Install libjpeg-turbo 3.x from official release
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.1.4.1
          curl -fL -o /tmp/ljt.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/ljt.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
      - name: Build the diff against the base branch
        run: |
          git diff "origin/${{ github.base_ref || 'main' }}"...HEAD > /tmp/pr.diff
          wc -l /tmp/pr.diff
      # Bounded on purpose. A large diff can produce hundreds of mutants, each
      # rebuilding and re-running three test binaries, and the first PR to
      # touch `compress_cmyk` blew straight through the 30-minute step limit —
      # a job that times out reports "fail" and tells the reader nothing. So
      # the work is capped at what fits, and whatever is skipped is announced
      # rather than quietly dropped.
      - name: Mutate only the changed lines
        run: |
          set -uo pipefail
          TOTAL=$(cargo mutants --in-diff /tmp/pr.diff --list 2>/dev/null | wc -l)
          echo "$TOTAL mutants in the changed lines"
          # Each mutant costs a full rebuild — measured at ~3 minutes on a
          # hosted runner — so the budget is about ten, not the ninety this
          # first guessed at. Guessing wrong is why PR #348 still timed out
          # after the bound was added.
          BUDGET=10
          SHARDS=$(( (TOTAL + BUDGET - 1) / BUDGET ))
          if [ "$SHARDS" -lt 1 ]; then SHARDS=1; fi
          if [ "$SHARDS" -gt 1 ]; then
            echo "::warning::$TOTAL mutants exceed this job's budget; testing shard 0/$SHARDS (~$BUDGET) and skipping the other $(( TOTAL - TOTAL / SHARDS )). A clean result here does NOT mean the whole diff was checked."
          fi
          cargo mutants --in-diff /tmp/pr.diff --shard "0/$SHARDS" -j 4 --timeout 300 \
            --cargo-test-arg --test --cargo-test-arg encode_pipeline_golden \
            --cargo-test-arg --test --cargo-test-arg encode_option_matrix \
            --cargo-test-arg --test --cargo-test-arg encode_input_validation \
            --cargo-test-arg --test --cargo-test-arg regression_rgb_direct_options \
            --cargo-test-arg --test --cargo-test-arg regression_cmyk_c_parity \
            || true
          echo "--- surviving mutants (review these) ---"
          cat mutants.out/missed.txt 2>/dev/null || echo "(none)"
        timeout-minutes: 45

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --all-targets compiles test binaries that include_bytes!
          # fixtures out of references/libjpeg-turbo (e.g. testorig.jpg).
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Library and bin code: zero allowances.
      - run: cargo clippy --workspace -- -D warnings
      # Tests/benches/examples too (issue #390). Three structural lints are
      # allowed in test code only — the sites are enumerated in
      # docs/last_mile/phase4.md P4-70; do not grow the list.
      - run: >
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::needless_range_loop
          -A clippy::too_many_arguments
          -A clippy::type_complexity

  # Proves each declared `rust-version` actually compiles (issue #390).
  # A single workspace-wide 1.87 check is impossible: the image-bridge
  # crate inherits image@0.25's rustc 1.88 floor, so it declares
  # rust-version 1.88 and gets its own pinned leg (codex P2: checking it
  # only on latest stable would let post-1.88 APIs slip past CI).
  msrv:
    name: MSRV (1.87 root/capi, 1.88 image bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.87 check -p libjpeg-turbo-rs --all-features
      - run: cargo +1.87 check -p libjpeg-turbo-rs --no-default-features
      - run: cargo +1.87 check -p libjpeg-turbo-rs-capi
      - run: cargo +1.88 check -p libjpeg-turbo-rs-image

  # Supply-chain gate (issue #390): advisories, licenses, duplicate majors,
  # untrusted sources. Policy lives in deny.toml. `--workspace` because the
  # root manifest is itself a package — without it cargo-deny roots the
  # graph at `libjpeg-turbo-rs` only and skips violations introduced
  # solely through the capi/image/wasm members (codex P2).
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features --workspace

  no-std:
    name: no_std + alloc build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Bare-metal target: proves the core codec links without std,
      # not merely that it compiles on a std-capable host (issue #356).
      - name: Build core codec without std
        run: cargo build --lib --no-default-features --target thumbv7em-none-eabihf
      - name: Build without std but with SIMD feature
        run: cargo build --lib --no-default-features --features simd --target thumbv7em-none-eabihf
      # The default (std) build must be unaffected.
      - name: Default features still build
        run: cargo build --lib

  publish-check:
    # Issue #380: the image/wasm bridge crates shipped with path-only
    # dependencies on the root crate and could not be published — the
    # `image`-bridge adoption channel simply did not exist on crates.io.
    # Two gates, because modern cargo (>=1.90) only WARNS on a missing
    # `version` key and infers one at package time:
    # 1. an explicit manifest assertion that every intra-workspace `path`
    #    dependency in crates/*/Cargo.toml carries a `version` key;
    # 2. `cargo package --no-verify` for each publishable member
    #    (--no-verify because the workspace version may not be on
    #    crates.io yet — this gates manifest shape, not registry state).
    name: Publish check (manifest + cargo package)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Intra-workspace path deps must carry a version key
        # Parsed as TOML (not grepped) so table-syntax deps
        # ([dependencies.foo] with path/version on separate lines) are
        # judged correctly. Dev-dependencies are exempt: cargo strips
        # versionless path dev-deps at publish time.
        run: |
          python3 - <<'EOF'
          import glob, sys, tomllib
          bad = 0
          for manifest in glob.glob("crates/*/Cargo.toml"):
              with open(manifest, "rb") as fh:
                  data = tomllib.load(fh)
              for section in ("dependencies", "build-dependencies"):
                  for name, spec in (data.get(section) or {}).items():
                      if isinstance(spec, dict) and "path" in spec and "version" not in spec:
                          print(f"::error file={manifest}::{section}.{name} has a path dependency without a version key (issue #380)")
                          bad = 1
          sys.exit(bad)
          EOF
      - name: cargo package every publishable member
        # --exclude-lockfile as well as --no-verify: lockfile generation
        # resolves the packaged `version = "0.8.0"` deps against
        # crates.io, which fails whenever the workspace version is ahead
        # of the published one (the normal state between releases).
        run: |
          set -euo pipefail
          for crate in libjpeg-turbo-rs libjpeg-turbo-rs-capi libjpeg-turbo-rs-image libjpeg-turbo-rs-wasm; do
            echo "::group::$crate"
            cargo package --no-verify --exclude-lockfile -p "$crate"
            echo "::endgroup::"
          done
      - name: Bridge feature wiring (isolated resolution, issue #381)
        # Must be `-p`: whole-workspace builds unify the root crate's
        # default `std` feature and would mask a bridge manifest that
        # drops it. `-p` resolves features exactly like a crates.io
        # consumer of the bridge does.
        run: cargo test -p libjpeg-turbo-rs-image

  miri:
    # Issue #389: interpret the non-SIMD unit tests under Miri. The simd
    # feature is off and simd:: module tests are skipped — Miri cannot
    # emulate vendor intrinsics — so this checks exactly the safe-Rust +
    # non-SIMD-unsafe surface (uninit-Vec patterns, BitWriter, parsing).
    # -Zmiri-disable-isolation because fixture-reading tests stat files.
    name: Miri (non-SIMD unit tests)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Quoted: a plain YAML scalar may not end in `:`; GitHub's parser
      # tolerates it but strict YAML tooling (PyYAML, actionlint) rejects
      # the whole file.
      - run: "cargo miri test --no-default-features --features std --lib -- --skip simd::"
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        timeout-minutes: 25

  test-lib:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check, test-lib]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo 3.x from official release (matches macOS homebrew; apt ships 2.1.x lacking -lossless/-precision/SOF3)
        run: |
          ARCH=$(dpkg --print-architecture)
          VERSION=3.1.4.1
          curl -fL -o /tmp/ljt.deb \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-official_${VERSION}_${ARCH}.deb"
          sudo apt-get install -y /tmp/ljt.deb
          echo "/opt/libjpeg-turbo/bin" >> $GITHUB_PATH
      - name: Verify C tools on PATH (expect libjpeg-turbo 3.x)
        run: |
          export PATH="/opt/libjpeg-turbo/bin:$PATH"
          djpeg -version
          cjpeg -version
          jpegtran -version
      - run: cargo test --tests
        timeout-minutes: 30
      # P4-82/P4-83 live in the non-default C-ABI workspace member, so the
      # root-only command above does not select their stock-cjpeg matrix. Run
      # the complete fast binary so a renamed/deleted test cannot pass as a
      # zero-test positional-filter match (P4-61).
      - name: Classic C-ABI scanline option parity
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_jpeglib_encode -- --nocapture
      # P4-139's span guards. Named explicitly for the reason the P4-81 note
      # below records from experience: tests in this crate are selected by
      # name, so a suite nothing names never runs and reports green forever.
      - name: Classic C-ABI span overflow guards (P4-139)
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_span_overflow_guards
          --test norealloc_buffer_capacity
          --test yuv_packed_length_overflow -- --nocapture
      # P4-13/P4-17's documented suspension proof is also in the C-ABI
      # workspace member. Its helper requires cjpeg/djpeg in CI and compilation
      # or oracle failures are fatal, so this cannot report green after a skip.
      - name: Classic C-ABI pathological lifecycle parity
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test capi_classic_lifecycle_pathological -- --nocapture
      # P4-81: the ELF symbol-version leg. This crate's tests are selected by
      # name here, so a suite that is never named never runs -- which is exactly
      # what happened to this one: it reported green on two full CI runs without
      # executing, because nothing invoked it. It stages the library through
      # scripts/install_capi.sh itself and asserts the relink happened, so a
      # degraded install fails rather than skipping. Linux-only: GNU symbol
      # versioning is an ELF feature.
      - name: Classic C-ABI GNU symbol versions (P4-81)
        run: |
          set -o pipefail
          cargo test -p libjpeg-turbo-rs-capi \
            --test capi_symbol_versions -- --nocapture 2>&1 | tee p481.log
          # The ELF assertions are the point of this leg; a skip means they did
          # not run and the nodes are unverified.
          if grep -q '^SKIP' p481.log; then
            echo "P4-81 symbol-version checks skipped in CI; this leg must run here" >&2
            grep '^SKIP' p481.log >&2
            exit 1
          fi
      # P4-108's destination canaries are differential: one C binary is linked
      # against our cdylib and against a reference libjpeg, and the two
      # contract reports must be byte-identical. Build the *pinned submodule*
      # with WITH_JPEG8=1 so the oracle is the same v8 ABI the shim claims,
      # rather than whatever libjpeg the runner image happens to ship.
      - name: Build the pinned reference libjpeg-turbo at the v8 ABI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm
          cmake -S references/libjpeg-turbo -B /tmp/ljt8/build \
            -DCMAKE_BUILD_TYPE=Release -DWITH_JPEG8=1 \
            -DCMAKE_INSTALL_PREFIX=/tmp/ljt8/prefix
          cmake --build /tmp/ljt8/build -j"$(nproc)"
          cmake --install /tmp/ljt8/build
          grep -Eq '^#define[[:space:]]+JPEG_LIB_VERSION[[:space:]]+80$' \
            /tmp/ljt8/prefix/include/jconfig.h
      # Ubuntu also provides /dev/full, so the fflush/ferror scenario runs for
      # real here instead of reporting itself unavailable as it does on macOS.
      - name: Classic destination ownership + stdio I/O parity (P4-108)
        env:
          LIBJPEG_TURBO_REFERENCE_DIR: /tmp/ljt8/prefix
        run: |
          set -o pipefail
          cargo test -p libjpeg-turbo-rs-capi \
            --test capi_classic_dest_ownership -- --nocapture 2>&1 | tee p4108.log
          # A missing reference build would silently drop the differential half
          # of every case, so fail closed on any skip line.
          if grep -q '^SKIP' p4108.log; then
            echo "P4-108 canaries skipped in CI; the reference leg is required here" >&2
            grep '^SKIP' p4108.log >&2
            exit 1
          fi
          grep -q 'dev_full_available=1' p4108.log || {
            echo "expected /dev/full to be exercised on ubuntu-latest" >&2
            exit 1
          }
      # P4-125's guard, P4-126/P4-128's plane-dimension matrix, and their C
      # oracles also live in the C-ABI workspace member, so `cargo test --tests`
      # above does not select them. Name each binary in full rather than
      # filtering, so a renamed or deleted test cannot report green as a
      # zero-test match (P4-61). The oracles need the turbojpeg headers the
      # install step above put in /opt/libjpeg-turbo; LIBJPEG_TURBO_PREFIX names
      # that prefix exclusively and makes them mandatory, so a missing or
      # TurboJPEG-2.x install fails this step instead of skipping it.
      - name: TurboJPEG YUV component-count guard and C parity
        run: >
          cargo test -p libjpeg-turbo-rs-capi
          --test yuv_four_component_guard
          --test yuv_decompress_planes_component_guard
          --test yuv_four_component_c_parity
          --test yuv_plane_index_c_parity
          --test yuv_validate_before_decode -- --nocapture
        env:
          LIBJPEG_TURBO_PREFIX: /opt/libjpeg-turbo

  test-cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  test-windows-workspace:
    # Issue #378 / P4-62: no job built the integration or capi test
    # targets on windows-msvc, so an MSVC-only link failure (the UCRT
    # does not export `snprintf`; format_message.rs binds it as its
    # printf oracle) shipped unseen and `cargo test --workspace` could
    # not even BUILD on a Windows host. This job:
    # 1. builds every workspace test target (`--no-run`), which is where
    #    LNK2019 surfaces — the next Windows-only link break fails here;
    # 2. runs the two suites the defect and its sibling live in, both
    #    deliberately C-tool-free: the capi printf-expansion oracle and
    #    the allocation budgets (whose gray_8x8 case measures 9 allocs
    #    on Windows, pinned per-platform in the test).
    # The full suite is NOT run here: the C cross-validation tests
    # hard-fail in CI when djpeg/cjpeg are absent, and provisioning
    # libjpeg-turbo tools on the Windows runner is its own project.
    name: Workspace build + targeted tests (windows)
    runs-on: windows-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build every workspace test target
        run: cargo test --workspace --no-run
        timeout-minutes: 30
      - name: Printf-expansion oracle (issue #378 fix)
        run: cargo test -p libjpeg-turbo-rs-capi --test format_message -- --nocapture
        timeout-minutes: 10
      - name: Allocation budgets (P4-62 sibling re-measure)
        run: cargo test -p libjpeg-turbo-rs --test alloc_budget_small_decode -- --nocapture
        timeout-minutes: 10

  capi-abi-checks:
    # P2-3 / P2-4 / P2-5: per-platform C-ABI structural validation.
    #
    # Two structural cross-checks against the libjpeg-turbo submodule:
    #
    # 1. `abi_offsets` — compiles a C harness against the submodule's
    #    `jpeglib.h` and asserts every const-asserted Rust offset
    #    equals the C-side `offsetof` on the host (catches struct
    #    layout drift in either direction).
    # 2. `symbol_inventory` — parses upstream `jpeglib.h` and
    #    `turbojpeg.h` for `EXTERN(...)` / `DLLEXPORT` declarations,
    #    dlopens our cdylib, and asserts every declared symbol is
    #    resolvable (catches drop-in surface drift). An explicit
    #    allowlist enumerates intentionally-deferred legacy symbols.
    #
    # Running both on ubuntu-latest (Linux x86_64 LP64),
    # macos-latest (aarch64 LP64), and windows-latest (x86_64 MSVC
    # LLP64) covers the three ABI flavours downstream consumers
    # care about. Each host probes its own ABI.
    #
    # Skip-with-reason on hosts where the gate trips (no cc on PATH,
    # 32-bit host that the Rust assertion block doesn't pin yet) —
    # those tests exit 0 with an `eprintln!("SKIP: ...")`.
    name: CAPI ABI Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ABI offset cross-check (P2-4)
        run: cargo test -p libjpeg-turbo-rs-capi --release --test abi_offsets -- --nocapture
        timeout-minutes: 10
      - name: Symbol inventory diff (P2-5)
        run: cargo test -p libjpeg-turbo-rs-capi --release --test symbol_inventory -- --nocapture
        timeout-minutes: 10

  test-cross-encode:
    name: C Interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest  # aarch64
            install: brew install jpeg-turbo
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libjpeg-turbo tools
        run: ${{ matrix.install }}
      # Full test run, deliberately unfiltered (issue #377, P4-61). The old
      # `cargo test "cross_encode|cross_check" --tests` matched nothing:
      # libtest's positional filter is a substring match against test NAMES
      # (not a regex, not file names), and the tests inside the
      # cross_check_*/cross_encode_* files have names like
      # c_xval_decode_bgr_444 — so the job built every test binary and ran
      # zero tests. Even the corrected multi-filter form
      # (`-- cross_encode cross_check`) selects only 8 tests by name.
      # This job's unique coverage is the C-tool environment: aarch64 +
      # Homebrew jpeg-turbo 3.x, the only such leg in CI. The former
      # ubuntu-latest leg is gone: with apt's 2.1.x tools the suite cannot
      # run (tests feed SOF3/12-bit streams to djpeg unconditionally), and
      # installing the official 3.1.4.1 deb would make it an exact duplicate
      # of the Integration Tests job.
      - run: cargo test --tests
        timeout-minutes: 30

  test-corpus:
    name: Corpus Test (C parity)
    runs-on: ubuntu-latest
    needs: [test-cross-encode]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build libjpeg-turbo 3.1.4.1 from source
        run: |
          sudo apt-get install -y cmake nasm
          git clone --depth 1 --branch 3.1.4.1 https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/ljt
          cmake -S /tmp/ljt -B /tmp/ljt/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/ljt/build -j$(nproc)
          sudo cmake --install /tmp/ljt/build
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: Generate corpus
        run: cargo run --release --example generate_corpus
        timeout-minutes: 15
      - name: Run corpus test
        run: |
          if ! cargo run --release --example corpus_test -- --corpus-dir tests/corpus/ > corpus-test.tsv 2>&1; then
            tail -200 corpus-test.tsv
            exit 1
          fi
          tail -5 corpus-test.tsv
        timeout-minutes: 30

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
