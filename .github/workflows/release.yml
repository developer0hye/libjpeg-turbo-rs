name: Release

on:
  push:
    # `v*`     — bumps the root crate; runs both crates.io and npm jobs.
    # `wasm-v*` — bumps only the WASM crate; the crates.io job is skipped
    #            and only the npm publish runs. This lets the WASM
    #            bindings ship fresh fixes without forcing a no-op patch
    #            release of the root crate when no Rust code changed.
    tags: ['v*', 'wasm-v*']
  release:
    types: [published]

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Skip the crates.io publish on WASM-only tag releases. The root
    # crate version hasn't changed in those, so `cargo publish` would
    # only emit the "already published" warning and add CI noise.
    if: ${{ !startsWith(github.ref, 'refs/tags/wasm-v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --allow-dirty
      - name: Publish to crates.io (skip if already published)
        run: cargo publish --allow-dirty 2>&1 || echo "::warning::crate already published or publish failed"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-wasm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: publish
    # `needs: publish` would block this job when the publish job is
    # skipped (WASM-only tag release). Override to run as long as
    # publish either succeeded or was deliberately skipped via its `if`.
    if: ${{ always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: curl https://wasmtime.dev/install.sh -sSf | bash && echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Run WASM test suite (wasm32-wasip1)
        run: cargo test --target wasm32-wasip1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run wasm-bindgen tests
        run: cd crates/libjpeg-turbo-rs-wasm && wasm-pack test --node

      - name: Build wasm-pack (bundler target)
        run: cd crates/libjpeg-turbo-rs-wasm && wasm-pack build --target bundler --out-dir pkg

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (skip if already published)
        run: cd crates/libjpeg-turbo-rs-wasm/pkg && npm publish --access public 2>&1 || echo "::warning::npm package already published or publish failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
